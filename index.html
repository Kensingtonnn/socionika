<title>Соционика без клише</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* layout: сайт-справочник — шапка с навигацией, одна колонка до 1080px; бумага серии в светлой теме, графит в тёмной */
:root{
 --bg:#F3EFE6; --surface:#F9F6EF; --fg:#1C1B18; --mut:#6E695F; --line:#D6CFC0; --ink:#1C1B18; --inkfg:#F3EFE6;
 --Ne:#6A4FA0; --Ni:#2C5B74; --Se:#A3322B; --Si:#2E8A7A; --Te:#B8651F; --Ti:#3F6A45; --Fe:#B03A6E; --Fi:#7B3A68;
 --good:#2E8A7A; --mid:#B8A36A; --hard:#B03A3A; --soft:#7A93B0;
 --serif:"Lora",Georgia,serif; --sans:"Inter",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
 --bg:#1A1916; --surface:#23211D; --fg:#ECE6DA; --mut:#A39C8E; --line:#3A3731; --ink:#ECE6DA; --inkfg:#1A1916;
 --Ne:#A48CD8; --Ni:#6FA3C2; --Se:#E0756B; --Si:#5CC3AF; --Te:#E39A55; --Ti:#7DB386; --Fe:#E27BA8; --Fi:#C27BAE;
 --good:#4FB8A3; --mid:#C9B67E; --hard:#E07070; --soft:#8FA8C4; color-scheme:dark } }
:root[data-theme="dark"]{
 --bg:#1A1916; --surface:#23211D; --fg:#ECE6DA; --mut:#A39C8E; --line:#3A3731; --ink:#ECE6DA; --inkfg:#1A1916;
 --Ne:#A48CD8; --Ni:#6FA3C2; --Se:#E0756B; --Si:#5CC3AF; --Te:#E39A55; --Ti:#7DB386; --Fe:#E27BA8; --Fi:#C27BAE;
 --good:#4FB8A3; --mid:#C9B67E; --hard:#E07070; --soft:#8FA8C4; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--sans);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--fg);text-decoration:none;margin-right:auto}
nav.main{display:flex;gap:4px}
nav.main a{color:var(--fg);text-decoration:none;font-size:14px;font-weight:500;padding:6px 12px;border-radius:999px}
nav.main a[aria-current="page"]{background:var(--fg);color:var(--bg)}
nav.main a:hover{box-shadow:inset 0 0 0 1px var(--line)}
.layers{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.layers .lbl{font-size:12px;color:var(--mut)}
.layers button{font:600 12px var(--sans);padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.layers button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--Ne);outline-offset:2px}
h1,h2{font-family:var(--serif);font-weight:600;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(36px,6vw,60px);line-height:1.04;margin:28px 0 8px}
h2{font-size:clamp(24px,3.4vw,32px);line-height:1.15;margin:40px 0 12px}
h3{font-size:17px;margin:0;line-height:1.3}
p{margin:0 0 10px}
.mut{color:var(--mut)} .sm{font-size:14px}
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600}
.lead{font-family:var(--serif);font-size:clamp(17px,2vw,20px);line-height:1.45;max-width:64ch}
.lay{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:1px 7px;border-radius:999px;border:1px solid currentColor;vertical-align:1px;margin-right:6px}
.l0{color:var(--fg)} .l1{color:var(--Ni)} .l2{color:var(--Te)} .l3{color:var(--Fe)}
body[data-show="0"] [data-layer]:not([data-layer="0"]){display:none}
body[data-show="1"] [data-layer="2"],body[data-show="1"] [data-layer="3"]{display:none}
body[data-show="2"] [data-layer="3"]{display:none}
.quads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:20px}
.quads h3{font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:2px}
.quads .vals{display:flex;gap:4px;margin-bottom:10px}
.tc{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.tc:hover{border-color:var(--fg)}
.tc .nm{font-weight:600;line-height:1.2} .tc .ru{font-size:12.5px;color:var(--mut)}
.tc .ss{display:flex;gap:2px;margin-left:auto}
.crumb{font-size:14px;margin-top:20px} .crumb a{color:var(--mut)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface);color:var(--fg);text-decoration:none}
a.chip:hover{border-color:var(--fg)}
.mrow{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin:18px 0 6px}
.mcell{border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;min-width:0;text-decoration:none;color:var(--fg)}
.mcell.v{background:var(--surface)}
.mcell .p{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.mcell .a{display:flex;justify-content:center;align-items:center;gap:4px;font-weight:700;margin:4px 0 0}
.mcell .t{font-size:11.5px;color:var(--mut)}
.dots{display:inline-flex;gap:3px;vertical-align:-1px} .dots i{width:8px;height:8px;border-radius:50%;border:1.2px solid var(--fg);display:block} .dots i.on{background:var(--fg)}
.fn{border-top:2px solid var(--c);padding:14px 0 18px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px}
.fn .side h3{color:var(--c);font-size:18px}
.fn .side .pos{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.fn .body{min-width:0}
.fn .simple{font-size:17px;font-weight:600;line-height:1.4;margin:4px 0 8px}
.pr{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;font-size:15px;line-height:1.5;padding:3px 0}
.pr b{color:var(--c)} .pr.no{color:var(--mut)} .pr.no b{color:var(--mut)}
.it{font-style:italic;margin-top:6px;font-size:15px}
.blk{margin:8px 0}
.note{font-size:14px;color:var(--mut);border-left:2px solid var(--line);padding-left:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.rgroup{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.rgroup .rn{font-weight:600;display:flex;align-items:center;gap:8px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.matrixw{overflow-x:auto;margin:16px 0}
table.mx{border-collapse:separate;border-spacing:3px;font-size:12px}
table.mx th{font-weight:600;color:var(--mut);padding:2px 4px;white-space:nowrap}
table.mx th.r{text-align:right}
table.mx td{width:44px;height:34px;text-align:center;border-radius:6px;cursor:pointer;color:var(--bg);font-weight:700;font-size:11px}
table.mx td:hover{outline:2px solid var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;margin:6px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.pick{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:16px 0}
.pick label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.pick select{font:500 15px var(--sans);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-width:200px}
.pick button{font:600 14px var(--sans);padding:9px 14px;border-radius:8px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);cursor:pointer}
.ch{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
.ch th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px;border-bottom:1.5px solid var(--fg)}
.ch td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.ch .asp{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.tw{overflow-x:auto}
.docs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
a.doc{display:flex;flex-direction:column;gap:2px;flex:1 1 200px;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
a.doc:hover{border-color:var(--fg)}
a.doc .kind{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
a.doc .dt{font-family:var(--serif);font-size:17px;line-height:1.25}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.traits span{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--surface)}
.big-rel{font-family:var(--serif);font-size:clamp(28px,4vw,40px);font-weight:600;margin:4px 0 8px;display:flex;align-items:center;gap:12px}
footer{margin-top:48px;font-size:13px;color:var(--mut)}

.hero{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:center;margin-top:18px}
.hero .ic svg{width:100%;height:auto;display:block}
.analogy{font-family:var(--serif);font-size:clamp(18px,2.3vw,22px);line-height:1.45;margin:12px 0}
.sheet{border-top:1px solid var(--line);margin-top:36px;padding-top:8px}
.sheet>h2{margin-top:10px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:14px 16px;min-width:0}
.card h4{margin:0 0 6px;font-size:16px}
.card h4 .c{color:var(--c)} .card h4 .m{font-weight:400;color:var(--mut);font-size:14px}
.card.big p{font-size:17px}
.prof svg{width:100%;max-width:640px;height:auto;display:block}
.ptab{width:100%;border-collapse:collapse;font-size:14.5px;min-width:620px}
.ptab th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px;border-bottom:1.5px solid var(--fg)}
.ptab td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.asphead{display:flex;align-items:center;gap:10px;margin:28px 0 10px}
.asphead .nm{font-family:var(--serif);font-size:22px;color:var(--c)}
.sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.side2{border-top:2px solid var(--c2);padding-top:8px;min-width:0}
.side2 .who{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{margin-top:10px;font-size:15px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ctag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:4px;color:var(--bg);white-space:nowrap}
.links svg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.sumg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sumg ul{margin:6px 0 0;padding-left:18px} .sumg li{margin:4px 0;font-size:15px}
.rk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.rk a{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.rk a:hover{border-color:var(--fg)}
@media (max-width:880px){ .hero{grid-template-columns:1fr} .hero .ic{max-width:220px} .rk{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .cards,.sides,.sumg{grid-template-columns:1fr} }

.acards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
.acard{display:flex;flex-direction:column;text-decoration:none;color:var(--fg);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:12px 14px;background:var(--surface);min-width:0}
.acard:hover{border-color:var(--c)}
.acard .aic svg{width:100%;max-width:170px;height:auto;display:block;margin-bottom:6px}
.acard .nm{font-family:var(--serif);font-size:18px;color:var(--c);font-weight:600}
table.gmap{border-collapse:separate;border-spacing:4px;font-size:12.5px;min-width:820px;width:100%}
table.gmap th{font-size:12px;color:var(--mut);font-weight:600;text-align:center;padding:4px}
table.gmap th.r{text-align:left;white-space:nowrap;color:var(--fg)}
table.gmap td{border:1px solid var(--line);border-top:3px solid var(--c);border-radius:6px;text-align:center;padding:6px 4px;line-height:1.3}
table.gmap td.v{background:var(--surface)}
table.gmap td a{color:var(--fg);text-decoration:none;display:block}
table.gmap td:hover{border-color:var(--c)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.stat{border-left:4px solid var(--c);background:var(--surface);border-radius:10px;padding:10px 14px}
.stat .k{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
.stat .v{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.stat .s{font-size:13px;color:var(--mut)}
.posblk{border-top:2px solid var(--c);padding:16px 0 22px;margin-top:18px;scroll-margin-top:110px}
.poshead{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.cbars{display:grid;gap:10px;margin:8px 0}
.cbar{display:grid;grid-template-columns:150px repeat(4,minmax(0,1fr));gap:6px;align-items:center}
.cb{border:1.5px dashed var(--line);border-radius:6px;padding:7px 4px;text-align:center;font-size:12.5px;color:var(--mut)}
.cb.on{border:2px solid var(--c);color:var(--fg);font-weight:600;background:var(--surface)}
@media (max-width:880px){ .acards,.stats{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:560px){ .cbar{grid-template-columns:repeat(4,minmax(0,1fr))} .cbar .who{grid-column:1/-1} }

.rngrid2{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.rc{border:1.5px dashed var(--hard);border-radius:8px;padding:8px;min-width:0}
.rc.same{border:1.5px solid var(--good);background:var(--surface)}
.rc .rn{font-size:12px;line-height:1.25;font-weight:600;overflow-wrap:anywhere;hyphens:auto}
.rc .rs{font-size:11px;color:var(--mut);margin-top:4px}
.rc.same .rs{color:var(--good)} .rc:not(.same) .rs{color:var(--hard)}
.ptab tr.df td{background:var(--surface)}
.stats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{min-width:0}
.rnrow{border-left:3px solid var(--good);padding:6px 0 8px 12px;margin:8px 0}
.rnrow.df{border-left-color:var(--hard)}
@media (max-width:560px){ .rngrid2{grid-template-columns:repeat(2,minmax(0,1fr))} .stats.s3,.stats{grid-template-columns:1fr} }

details.fold{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 16px;margin-top:10px}
details.fold>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:14px 28px 14px 0;position:relative}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";position:absolute;right:0;top:10px;font-size:24px;line-height:1;color:var(--mut)}
details.fold[open]>summary::after{content:"−"}
details.fold>summary .st{font-family:var(--serif);font-size:22px;font-weight:600;width:100%}
details.fold>summary:focus-visible{outline:2px solid var(--Ne);outline-offset:2px;border-radius:8px}
details.fold[open]{padding-bottom:16px}

.tipb{font:inherit;color:inherit;background:none;border:0;padding:0;border-bottom:1px dotted var(--mut);cursor:help;text-align:left}
.tipb.ctag{border-bottom:0;padding:2px 8px;border-radius:4px;color:var(--bg);font-size:11px;font-weight:700;cursor:help}
.ctag.g{background:var(--good);color:var(--bg)} .ctag.h{background:var(--hard);color:var(--bg)}
#tip{position:fixed;z-index:60;max-width:min(320px,calc(100vw - 32px));background:var(--ink);color:var(--inkfg);font-size:13.5px;line-height:1.45;padding:9px 12px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);pointer-events:none}
.poles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;font-size:14px;margin-top:4px}
details.fold.sub{background:var(--bg);margin-top:14px}
@media (max-width:560px){ .poles{grid-template-columns:1fr} }

.toy{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px;margin-top:10px;touch-action:none}
.toy svg,.toy canvas{width:100%;height:auto;display:block}
.toybar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.tbtn{font:600 14px var(--sans);padding:9px 14px;border-radius:999px;border:1px solid var(--c,var(--fg));background:var(--c,var(--fg));color:var(--bg);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.tbtn.ghost{background:none;color:var(--fg);border-color:var(--line)}
.meter{position:relative;flex:1 1 200px;height:12px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.mfill{height:100%;background:var(--c)} .mth{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg)} .mth.hot{background:var(--Se)}
.ne-wrap{overflow-x:auto} .ne-count{font-size:14px;margin-bottom:8px}
.ne-tree,.ne-tree ul{list-style:none;margin:0;padding-left:22px;border-left:1px dashed var(--line)} .ne-tree{padding-left:0;border:0}
.ne-tree li{margin:6px 0}
.ne-n{font:500 14px var(--sans);border:1px solid var(--c);color:var(--fg);background:var(--bg);border-radius:999px;padding:5px 12px;cursor:pointer}
.ne-n[data-open]{background:var(--c);color:var(--bg)} .ne-n.root{font-size:16px;padding:8px 16px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.ni-cards button,.ti-opts button{font:500 14px var(--sans);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c);color:var(--bg);border-color:var(--c)}
.te-wrap{display:grid;gap:12px} .te-row{display:grid;gap:4px}
.te-bars{display:grid;gap:6px;margin-top:6px} .tb{display:grid;grid-template-columns:90px 1fr 100px;gap:8px;align-items:center;font-size:14px}
.bar{height:14px;background:var(--bg);border:1px solid var(--line);border-radius:7px;overflow:hidden} .bar i{display:block;height:100%;background:var(--Te);transition:width .3s} .bar i.loss{background:var(--hard)} .bar i.res{background:var(--good)}
.te-kpd{font-family:var(--serif);font-size:28px} .te-kpd b{color:var(--Te)}
.si-grid,.ni-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.sl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);margin-top:10px} .sl input{accent-color:var(--c)}
.si-feel{margin-top:12px;font-size:15px}
.ni-ap{max-width:220px;margin:0 auto}

отовность собраться для рывка — у вещей, решений, пространства, тела"], "Ni": ["сроки, пунктуальность, прогнозы", "сюжет: что из чего вытекает, на какой стадии процесс, созрело ли"], "Si": ["уют и комфорт", "самочувствие: как сочетается всё, что есть одновременно — тело, свет, звук, вещи, процессы"], "Fi": ["отношения с людьми, мораль", "гравитация: что своё, что чужое, какая дистанция — к людям, местам, делам, вещам, идеям"], "Te": ["деньги и работа", "КПД: во что превращается усилие — в деле, технике, теле, быту"], "Ti": ["порядок и правила", "мера: что чему соответствует, к какому классу относится, где противоречие"], "Fe": ["эмоции и настроение", "зажигание: что разгорается и что гаснет — в событии, тексте, проекте, месте"], "Ne": ["креатив и перспективы", "запас: на что ещё способны вещь, человек, идея, положение"]}, "deepfull": {"Ne": "Видеть запас: на что ещё способны вещь, человек, идея или положение, чем они могут стать, какие есть другие выходы. По Аугустинавичюте — потенциальная энергия объекта.", "Fe": "Чувствовать заряд: что разгорается, что гаснет, где «может быть» переходит в «началось», — и уметь поднять или погасить накал. По Аугустинавичюте — переход энергии в движение.", "Se": "Чувствовать массу и форму: сколько что весит, сколько занимает места, готово ли прямо сейчас тратить силу, выразительно ли. По Аугустинавичюте — кинетическая энергия.", "Te": "Видеть, во что превращается энергия: вложенное усилие, полученный результат, потери по дороге. По Аугустинавичюте — использование энергии.", "Si": "Чувствовать, как сочетается всё, что есть одновременно: тело, свет, звук, вещи, процессы — и каково от этого. По Аугустинавичюте — пространство и самочувствие в нём.", "Ni": "Видеть линию: что из чего вытекает, на какой стадии процесс, созрело ли, пора или рано. По Аугустинавичюте — связь событий, идущих друг за другом.", "Ti": "Держать мир в пропорции: что чему равно, что к какому классу относится, что чему противоречит. По Аугустинавичюте — объективная мера одного объекта другим.", "Fi": "Чувствовать силу и знак притяжения: что своё, что чужое, что к чему тянется, какая между всем дистанция. По Аугустинавичюте — субъективное притяжение и отталкивание."}, "pairtxt": {"ILE|SEI": {"Ne": [null, "Запас, который Дон Кихот видит без усилия, попадает ровно туда, где у Дюма тихая жажда. Неизвестность перестаёт быть угрозой."], "Si": [null, "Цельное ощущение от Дюма приходит туда, где у Дон Кихота сигнал опаздывает: идеи начинают жить в реальных вещах и местах."], "Ti": [null, "Мера Дон Кихота даёт Дюма толчок: когда всё разложено и понятно почему, хочется действовать."], "Fe": [null, "Зажигание Дюма даёт Дон Кихоту толчок: идея, на которую откликнулись живо, переходит из «может быть» в «началось»."], "Ni": [null, "Дон Кихот видит сюжет, но не делает его мерилом — Дюма может не изображать того, кто знает, чем всё кончится."], "Se": [null, "Дюма чувствует вес вещей и решений, но не делает его мерилом — Дон Кихоту не нужно изображать весомость."], "Te": [null, "Где у Дюма самое уязвимое, у Дон Кихота сильная фоновая функция: показывает рабочий путь и не устраивает экзаменов на эффективность."], "Fi": [null, "Где у Дон Кихота самое уязвимое, у Дюма сильная фоновая функция: держит «своё» за двоих — место, вещи, дела, связи — и не проверяет на верность."]}, "LSI|EIE": {"Ti": [null, "Система Максима попадает туда, где у Гамлета тихая жажда ясности: в буре переживаний появляются пропорции."], "Fe": [null, "Накал Гамлета попадает туда, где у Максима жажда огня: верная, но холодная система начинает гореть."], "Se": [null, "Вес Максима бодрит Гамлета: на прочное можно опереться и действовать."], "Ni": [null, "Сюжет Гамлета бодрит Максима: система получает направление."], "Te": [null, "Максим видит КПД, но не делает его мерилом — Гамлету не нужно изображать деловитость."], "Fi": [null, "Гамлет чувствует «своё», но не превращает его в устав — Максиму не нужно изображать правильную привязанность."], "Si": [null, "Где у Гамлета самое уязвимое, у Максима сильная фоновая функция: держит тело и пространство в порядке и не делает замечаний."], "Ne": [null, "Где у Максима самое уязвимое, у Гамлета сильная фоновая функция: между делом показывает запасной выход и не высмеивает верность системе."]}, "SEE|ILI": {"Se": [null, "Вес Наполеона попадает туда, где у Бальзака жажда: линия, которую он видит, наконец сдвигается с места."], "Ni": [null, "Сюжет Бальзака попадает туда, где у Наполеона жажда: масса момента получает направление."], "Fi": [null, "Притяжения Наполеона бодрят Бальзака: он чувствует себя своим и выходит из отстранённости."], "Te": [null, "КПД Бальзака бодрит Наполеона: вес и рывок превращаются в результат."], "Si": [null, "Наполеон чувствует удобство, но не делает его мерилом — Бальзаку не нужно изображать «правильный» быт."], "Ne": [null, "Бальзак видит варианты, но не требует новых идей — Наполеону не нужно изображать человека перспектив."], "Fe": [null, "Где у Бальзака самое уязвимое, у Наполеона сильная фоновая функция: разжигает накал вокруг и не требует ответного восторга."], "Ti": [null, "Где у Наполеона самое уязвимое, у Бальзака сильная фоновая функция: тихо проверяет конструкцию, без публичных разборов."]}, "SEI|IEE": {"Si": [null, "Что Дюма делает уверенно и с прицелом на будущее, Гексли ждёт извне и принимает без проверки."], "Ne": [null, "Широкий взгляд Гексли попадает точно туда, где у Дюма тихая жажда."], "Fe": [null, "Дюма разжигает ради людей, а Гексли и сам зажигает фоном — старания проходят незамеченными."], "Fi": [null, "Гексли выстраивает связи, а Дюма держит своих автоматически — помощь кажется лишней."], "Ni": [null, "Гексли не требует от Дюма планов и сроков — роль можно не играть."], "Se": [null, "Дюма не меряется силой — Гексли не нужно изображать жёсткость."], "Te": [null, "То, что бодрит Гексли, — самое уязвимое у Дюма, и прикрыть некому."], "Ti": [null, "Ясность, которая бодрит Дюма, бьёт по болевой Гексли."]}, "ILE|EII": {"Fi": ["удар в болевую", "Главное Достоевского — ровно то, где у Дон Кихота больнее всего. Даже без упрёков, просто живя по меркам «своё — чужое», он задевает: «а тебе это правда дорого?»"], "Ne": ["сильнее в главном", "Достоевский силён и в главной оптике Дон Кихота, но направляет запас на «своё». Удивить его трудно, а идеи Дон Кихота он тихо поправляет: «а зачем это и кому?»"], "Ti": ["инструмент в роль", "Инструмент Дон Кихота — модели и системы — попадает в ролевую Достоевского: тому приходится держать лицо в логике, и это утомляет."], "Se": ["слабое на слабом", "Здесь оба слабы: изображённый напор Дон Кихота редко ранит Достоевского всерьёз, но и опоры в весе ни один другому не даст."], "Te": ["помощь без адреса", "Дон Кихот делает дельно на автомате — ровно то, чего жаждет Достоевский. Но помощь неосознанная и нерегулярная: он не замечает, что этого от него ждут."], "Si": ["общий голод", "Оба ценят самочувствие и оба в нём слабы. Голод общий, а утолить его некому."], "Fe": ["сдержанный огонь", "Достоевский может зажечь, но сдерживает. Дон Кихот, которого накал бодрит, получает меньше, чем хотел бы, и чувствует оценку там, где ждал отклика."], "Ni": ["мимо друг друга", "Оба видят сюжет и оба его не ценят: эта тема между ними просто не возникает."]}, "ILE|ESE": {"Ne": ["подзарядка", "Запас, который Дон Кихот видит без усилия, бодрит Гюго: подъёму есть куда двигаться."], "Fe": ["подзарядка", "Накал Гюго включает Дон Кихота: идея начинает гореть. Но ведущая — это много: долгий накал Дон Кихота перегревает."], "Ti": ["восполнение порциями", "Мера Дон Кихота утоляет жажду Гюго, но приходит через инструмент, по ситуации, а не как постоянный взгляд на мир."], "Si": ["восполнение порциями", "Гюго настраивает ощущения под момент — Дон Кихоту становится легче, — но надолго самочувствие не выстраивает."], "Se": ["снятие роли", "Гюго на автомате придаёт вес — Дон Кихоту не нужно изображать весомость."], "Te": ["снятие роли", "Дон Кихот на автомате видит, как сделать, чтобы сработало, — Гюго не нужно изображать деловитость."], "Fi": ["неполное прикрытие", "Гюго чувствует «своё», но сдерживает: обычно не задевает, но и не держит за двоих. В ссоре может ударить точно: «тебе ведь всё равно»."], "Ni": ["неполное прикрытие", "Дон Кихот видит сюжет, но не делает его мерилом: обычно не пугает. В ссоре может ударить точно: «и к чему это всё приведёт?»"]}, "ESE|LII": {"Ti": [null, "Мера Робеспьера попадает туда, где у Гюго тихая жажда ясности: в накале появляется порядок, и можно не держать всё на одной эмоции."], "Fe": [null, "Накал Гюго попадает туда, где у Робеспьера жажда огня: верная, но холодная схема начинает жить."], "Ne": [null, "Запас Робеспьера бодрит Гюго: неожиданный ход или новая возможность дают повод для следующего подъёма."], "Si": [null, "Самочувствие Гюго бодрит Робеспьера: тепло, еда, удобство возвращают его из головы в тело."], "Te": [null, "Робеспьер видит КПД, но не делает его мерилом — Гюго не нужно изображать деловитость."], "Fi": [null, "Гюго чувствует, кто свой, но не превращает это в правило — Робеспьеру не нужно изображать правильную привязанность."], "Ni": [null, "Где у Гюго самое уязвимое, у Робеспьера сильная фоновая функция: между делом держит линию событий и не спрашивает «а к чему всё это»."], "Se": [null, "Где у Робеспьера самое уязвимое, у Гюго сильная фоновая функция: спокойно занимает место и даёт решению вес, не требуя «дай отпор»."]}, "SLE|IEI": {"Se": [null, "Вес Жукова попадает туда, где у Есенина тихая жажда опоры: появляется тот, кто решит и доведёт, и можно не собираться самому."], "Ni": [null, "Сюжет Есенина попадает туда, где у Жукова жажда направления: сила получает линию — когда идти, а когда подождать."], "Ti": [null, "Мера Жукова бодрит Есенина: размытое ожидание становится понятной схемой, с которой можно начать."], "Fe": [null, "Зажигание Есенина бодрит Жукова: тонко поднятый накал делает напор живым, а не механическим."], "Si": [null, "Жуков чувствует тело и обстановку, но не делает из этого культа — Есенину не нужно изображать бодрость и порядок в быту."], "Ne": [null, "Есенин видит запасные ходы, но не превращает их в требование — Жукову не нужно изображать широту взглядов."], "Te": [null, "Где у Есенина самое уязвимое, у Жукова сильная фоновая функция: между делом налаживает, как сделать, и не говорит «от тебя никакого толку»."], "Fi": [null, "Где у Жукова самое уязвимое, у Есенина сильная фоновая функция: держит «своих» рядом и тихо гасит обиды, которых Жуков не заметил."]}, "LIE|ESI": {"Te": [null, "КПД Джека попадает туда, где у Драйзера тихая жажда толка: появляется тот, кто знает, как сделать с результатом, и можно не тянуть всё на одном принципе."], "Fi": [null, "Гравитация Драйзера попадает туда, где у Джека жажда своих: дело и движение получают тыл — людей, которым он по-настоящему свой."], "Ni": [null, "Сюжет Джека бодрит Драйзера: понятно, к чему всё идёт, и уходит страх, что завтра всё рухнет."], "Se": [null, "Вес Драйзера бодрит Джека: твёрдое «да» и «нет», занятая позиция — и можно рвануть."], "Ti": [null, "Джек видит меру, но не устраивает экзаменов по логике — Драйзеру не нужно доказывать каждое суждение."], "Fe": [null, "Драйзер чувствует накал, но держит его ровным — Джеку не нужно изображать бурные чувства."], "Ne": [null, "Где у Драйзера самое уязвимое, у Джека сильная фоновая функция: между делом находит обходной путь и не пугает «а вдруг всё иначе»."], "Si": [null, "Где у Джека самое уязвимое, у Драйзера сильная фоновая функция: следит, чтобы он поел, выспался и был в тепле, и не делает замечаний."]}, "LSE|EII": {"Te": [null, "КПД Штирлица попадает туда, где у Достоевского тихая жажда толка: благие намерения превращаются в сделанное."], "Fi": [null, "Гравитация Достоевского попадает туда, где у Штирлица жажда своих: налаженный порядок наполняется смыслом «для кого»."], "Si": [null, "Самочувствие Штирлица бодрит Достоевского: ухоженный дом, удобные вещи, вкусная еда возвращают его в тело."], "Ne": [null, "Запас Достоевского бодрит Штирлица: он видит в людях и делах возможности, о которых Штирлиц не думал."], "Ti": [null, "Штирлиц держит правила, но не устраивает экзаменов — Достоевскому не нужно доказывать логичность каждого шага."], "Fe": [null, "Достоевский чувствует накал, но не раздувает его — Штирлицу не нужно изображать восторг."], "Se": [null, "Где у Достоевского самое уязвимое, у Штирлица сильная фоновая функция: спокойно отстаивает место и решения, и Достоевскому не приходится давать отпор."], "Ni": [null, "Где у Штирлица самое уязвимое, у Достоевского сильная фоновая функция: чувствует, когда пора и когда рано, и не говорит «надо было предвидеть»."]}, "SLI|IEE": {"Si": [null, "Самочувствие Габена попадает туда, где у Гексли тихая жажда телесного покоя: появляется тот, рядом с кем удобно, вкусно и спокойно."], "Ne": [null, "Запас Гексли попадает туда, где у Габена жажда новых ходов: привычное дело вдруг показывает другие применения."], "Te": [null, "КПД Габена бодрит Гексли: идеи превращаются в сделанное руками, и хочется продолжать."], "Fi": [null, "Гравитация Гексли бодрит Габена: тёплое «ты свой» вытаскивает его из закрытости."], "Se": [null, "Габен силён в весе, но не меряется силой — Гексли не нужно изображать напористость."], "Ni": [null, "Гексли видит линию, но не требует планов — Габену не нужно изображать дальновидность."], "Ti": [null, "Где у Гексли самое уязвимое, у Габена сильная фоновая функция: между делом раскладывает по полочкам и не говорит «у тебя нет системы»."], "Fe": [null, "Где у Габена самое уязвимое, у Гексли сильная фоновая функция: легко поднимает и гасит накал и не требует «покажи эмоции»."]}}, "icons": {"Fi": "<svg viewBox=\"0 0 200 110\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter\"><defs><marker id=\"icFi\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--Fi)\"/></marker></defs><circle cx=\"100\" cy=\"55\" r=\"12\" fill=\"var(--Fi)\"/><ellipse cx=\"100\" cy=\"55\" rx=\"41.6\" ry=\"24.7\" fill=\"none\" stroke=\"var(--Fi)\" stroke-width=\"1.2\"/><ellipse cx=\"100\" cy=\"55\" rx=\"64.0\" ry=\"38.0\" fill=\"none\" stroke=\"var(--Fi)\" stroke-width=\"1.2\"/><ellipse cx=\"100\" cy=\"55\" rx=\"83.2\" ry=\"49.4\" fill=\"none\" stroke=\"var(--Fi)\" stroke-width=\"1.2\"/><circle cx=\"142\" cy=\"50\" r=\"5\" fill=\"var(--Fi)\"/><circle cx=\"40\" cy=\"70\" r=\"5\" fill=\"var(--Fi)\"/><circle cx=\"170\" cy=\"70\" r=\"5\" fill=\"var(--Fi)\"/></svg>", "Te": "<svg viewBox=\"0 0 200 110\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter\"><defs><marker id=\"icTe\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--Te)\"/></marker></defs><rect x=\"10\" y=\"38\" width=\"44\" height=\"34\" fill=\"none\" stroke=\"var(--Te)\" stroke-width=\"2\"/><text x=\"32\" y=\"59\" text-anchor=\"middle\" font-size=\"9\" fill=\"var(--Te)\">вход</text><line x1=\"56\" y1=\"55\" x2=\"78\" y2=\"55\" stroke=\"var(--Te)\" stroke-width=\"2\" marker-end=\"url(#icTe)\"/><rect x=\"80\" y=\"38\" width=\"44\" height=\"34\" fill=\"none\" stroke=\"var(--Te)\" stroke-width=\"2\"/><text x=\"102\" y=\"59\" text-anchor=\"middle\" font-size=\"9\" fill=\"var(--Te)\">усилие</text><line x1=\"126\" y1=\"55\" x2=\"148\" y2=\"55\" stroke=\"var(--Te)\" stroke-width=\"2\" marker-end=\"url(#icTe)\"/><rect x=\"150\" y=\"38\" width=\"44\" height=\"34\" fill=\"var(--Te)\"/><text x=\"172\" y=\"59\" text-anchor=\"middle\" font-size=\"9\" fill=\"#F3EFE6\">итог</text><path d=\"M102 74 V 92\" stroke=\"var(--Te)\" stroke-width=\"1.2\" stroke-dasharray=\"2 2\"/><text x=\"102\" y=\"104\" text-anchor=\"middle\" font-size=\"8\" fill=\"var(--Te)\">потери</text></svg>", "Ni": "<svg viewBox=\"0 0 200 110\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter\"><defs><marker id=\"icNi\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--Ni)\"/></marker></defs><path d=\"M10 96 C 50 90, 70 70, 100 50 S 150 16, 190 18\" fill=\"none\" stroke=\"var(--Ni)\" stroke-width=\"2.4\"/><circle cx=\"30\" cy=\"92\" r=\"5\" fill=\"var(--Ni)\"/><circle cx=\"80\" cy=\"62\" r=\"5\" fill=\"var(--Ni)\"/><circle cx=\"130\" cy=\"32\" r=\"5\" fill=\"var(--Ni)\"/><circle cx=\"166\" cy=\"20\" r=\"6\" fill=\"none\" stroke=\"var(--Ni)\" stroke-width=\"1.6\"/></svg>", "Se": "<svg viewBox=\"0 0 200 110\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter\"><defs><marker id=\"icSe\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--Se)\"/></marker></defs><circle cx=\"70\" cy=\"55\" r=\"34\" fill=\"var(--Se)\"/><line x1=\"108\" y1=\"55\" x2=\"180\" y2=\"55\" stroke=\"var(--Se)\" stroke-width=\"5\" marker-end=\"url(#icSe)\"/><circle cx=\"70\" cy=\"55\" r=\"48\" fill=\"none\" stroke=\"var(--Se)\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/></svg>", "Ti": "<svg viewBox=\"0 0 200 110\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter\"><defs><marker id=\"icTi\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--Ti)\"/></marker></defs><line x1=\"10\" y1=\"92\" x2=\"190\" y2=\"92\" stroke=\"var(--Ti)\" stroke-width=\"2\"/><line x1=\"10\" y1=\"86\" x2=\"10\" y2=\"98\" stroke=\"var(--Ti)\" stroke-width=\"1\"/><line x1=\"40\" y1=\"86\" x2=\"40\" y2=\"98\" stroke=\"var(--Ti)\" stroke-width=\"1\"/><line x1=\"70\" y1=\"86\" x2=\"70\" y2=\"98\" stroke=\"var(--Ti)\" stroke-width=\"1\"/><line x1=\"100\" y1=\"86\" x2=\"100\" y2=\"98\" stroke=\"var(--Ti)\" stroke-width=\"1\"/><line x1=\"130\" y1=\"86\" x2=\"130\" y2=\"98\" stroke=\"var(--Ti)\" stroke-width=\"1\"/><line x1=\"160\" y1=\"86\" x2=\"160\" y2=\"98\" stroke=\"var(--Ti)\" stroke-width=\"1\"/><line x1=\"190\" y1=\"86\" x2=\"190\" y2=\"98\" stroke=\"var(--Ti)\" stroke-width=\"1\"/><rect x=\"30\" y=\"60\" width=\"28\" height=\"28\" fill=\"none\" stroke=\"var(--Ti)\" stroke-width=\"1.8\"/><rect x=\"80\" y=\"36\" width=\"52\" height=\"52\" fill=\"none\" stroke=\"var(--Ti)\" stroke-width=\"1.8\"/><rect x=\"148\" y=\"8\" width=\"80\" height=\"80\" fill=\"none\" stroke=\"var(--Ti)\" stroke-width=\"1.8\"/></svg>", "Fe": "<svg viewBox=\"0 0 200 110\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter\"><defs><marker id=\"icFe\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--Fe)\"/></marker></defs><path d=\"M10 92 C 60 90, 80 80, 100 50 S 140 18, 190 22\" fill=\"none\" stroke=\"var(--Fe)\" stroke-width=\"2.4\"/><g transform=\"translate(100,50)\"><path d=\"M0 -16 L5 -5 L16 -5 L7 2 L10 14 L0 7 L-10 14 L-7 2 L-16 -5 L-5 -5 Z\" fill=\"var(--Fe)\"/></g></svg>", "Ne": "<svg viewBox=\"0 0 200 110\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter\"><defs><marker id=\"icNe\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--Ne)\"/></marker></defs><circle cx=\"40\" cy=\"55\" r=\"16\" fill=\"var(--Ne)\"/><path d=\"M56 55 C 90 55, 110 14, 160 14\" fill=\"none\" stroke=\"var(--Ne)\" stroke-width=\"1.6\" stroke-dasharray=\"3 3\" marker-end=\"url(#icNe)\"/><circle cx=\"172\" cy=\"14\" r=\"6\" fill=\"none\" stroke=\"var(--Ne)\" stroke-width=\"1.4\"/><path d=\"M56 55 C 90 55, 110 40, 160 40\" fill=\"none\" stroke=\"var(--Ne)\" stroke-width=\"1.6\" stroke-dasharray=\"3 3\" marker-end=\"url(#icNe)\"/><circle cx=\"172\" cy=\"40\" r=\"6\" fill=\"none\" stroke=\"var(--Ne)\" stroke-width=\"1.4\"/><path d=\"M56 55 C 90 55, 110 70, 160 70\" fill=\"none\" stroke=\"var(--Ne)\" stroke-width=\"1.6\" stroke-dasharray=\"3 3\" marker-end=\"url(#icNe)\"/><circle cx=\"172\" cy=\"70\" r=\"6\" fill=\"none\" stroke=\"var(--Ne)\" stroke-width=\"1.4\"/><path d=\"M56 55 C 90 55, 110 96, 160 96\" fill=\"none\" stroke=\"var(--Ne)\" stroke-width=\"1.6\" stroke-dasharray=\"3 3\" marker-end=\"url(#icNe)\"/><circle cx=\"172\" cy=\"96\" r=\"6\" fill=\"none\" stroke=\"var(--Ne)\" stroke-width=\"1.4\"/></svg>", "Si": "<svg viewBox=\"0 0 200 110\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter\"><defs><marker id=\"icSi\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10 z\" fill=\"var(--Si)\"/></marker></defs><path d=\"M10 40 C 30 20, 50 20, 70 40 S 110 60, 130 40 S 170 20, 190 40\" fill=\"none\" stroke=\"var(--Si)\" stroke-width=\"2.2\"/><path d=\"M10 70 C 30 50, 50 50, 70 70 S 110 90, 130 70 S 170 50, 190 70\" fill=\"none\" stroke=\"var(--Si)\" stroke-width=\"2.2\" opacity=\".55\"/><line x1=\"40\" y1=\"18\" x2=\"40\" y2=\"96\" stroke=\"var(--Si)\" stroke-width=\".8\" stroke-dasharray=\"2 3\"/><line x1=\"100\" y1=\"18\" x2=\"100\" y2=\"96\" stroke=\"var(--Si)\" stroke-width=\".8\" stroke-dasharray=\"2 3\"/><line x1=\"160\" y1=\"18\" x2=\"160\" y2=\"96\" stroke=\"var(--Si)\" stroke-width=\".8\" stroke-dasharray=\"2 3\"/></svg>"}, "types": {"ILE": {"name": "Дон Кихот", "ru": "ИЛЭ", "m": ["Ne", "Ti", "Se", "Fi", "Si", "Fe", "Ni", "Te"], "q": "Альфа", "rat": false, "dual": "SEI", "traits": ["экстраверты", "интуиты", "логики", "иррационалы", "статики", "демократы", "весёлые", "рассудительные", "беспечные", "уступчивые", "квестимы", "позитивисты", "тактики", "конструктивисты", "процессоры"], "lens": {"Fi": ["Устойчивое «своё» — дело, место, вещь, человек — держится плохо: отношение плывёт за интересом.", "<div class=\"pr\"><b>Опыт:</b><span>только свои истории привязанностей: какие проекты бросил, какие города любил, какие вещи хранил, какие связи рвались.</span></div><div class=\"pr no\"><b>Нормы:</b><span><i>нет</i> — не знает изнутри, «как положено» быть верным делу, месту, человеку.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не видит, где дистанция уже нарушена и что здесь «чужое».</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не чувствует, что со временем станет своим.</span></div><div class=\"it\">Отношение к проекту, городу, вещи, человеку плывёт за интересом, и упрёк «тебе всё равно» попадает в самое уязвимое.</div>"], "Te": ["Между делом видит, как сделать, чтобы сработало, — в технике, работе, чужих делах, — и не придаёт этому значения.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, какие способы сработали.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, как принято делать хорошо — в работе, технике, общем деле, быту.</span></div><div class=\"pr\"><b>Ситуация:</b><span>видит, как сделать именно здесь, чтобы заработало: какой инструмент, какой порядок, где срезать лишнее.</span></div><div class=\"pr\"><b>Время:</b><span>понимает, во что выльется усилие и где будут потери.</span></div><div class=\"it\">Всё это — на автомате и между делом. Своё умение делать дельно он не ценит и редко замечает.</div>"], "Ni": ["Видит, на какой стадии процесс и что из чего вытекает, но линию не держит как главное.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, как обычно разворачиваются истории, проекты, тренды.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает типовые сюжеты и стадии: как зреет идея, как стареет вещь, как строится дуга трека или фильма.</span></div><div class=\"pr\"><b>Ситуация:</b><span>видит, на какой стадии именно этот процесс и что из чего тут вытекает, — может выбрать момент.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — линию не держит как ценность: видит сюжет, но предпочитает оставить его открытым для новых ветвей.</span></div><div class=\"it\">Умеет, но сдерживает: сюжет для него — фон, а не главное.</div>"], "Se": ["Изображает весомость и напор по образцу — перед людьми, в подаче, в решениях, — и быстро выдыхается.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, когда пришлось собраться, занять место или сделать что-то весомым.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, как «должно выглядеть» основательное: солидная вещь, уверенная подача, заметная форма, — и делает по образцу.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не чувствует массу конкретного: сколько весит этот аргумент, эта вещь, это решение; сколько места здесь занять и когда собрать тело для рывка.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не держит вес на дистанции: мобилизация то есть, то нет.</span></div><div class=\"it\">Поэтому форма и напор выходят то избыточными, то пустыми, а после такой роли он выдыхается.</div>"], "Ti": ["Раскладывает всё по полочкам и строит модели — механизма, проекта, идеи, поведения людей: как устроено и что из чего следует.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, какие объяснения и модели работали.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает принятые схемы, классификации, правила вывода.</span></div><div class=\"pr\"><b>Ситуация:</b><span>строит систему под конкретную задачу — устройство механизма, логику проекта, структуру знания — и легко нарушает канон ради более точной модели.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — модель строит для «сейчас» и не держится за неё, когда видит новую возможность.</span></div>"], "Fe": ["Сам накал не поднимает — ни в общении, ни в тексте, ни в подаче, — но оживает, когда рядом что-то загорается.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, что его заводило: музыка, событие, образ, чужой отклик.</span></div><div class=\"pr\"><b>Нормы:</b><span>охотно перенимает образцы того, как выразить и вызвать чувство — в тексте, подаче идеи, оформлении — и рад отклику.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не чувствует, где накал уместен: пишет сухо там, где нужен огонь, или горячится не к месту.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не выстраивает драматургию.</span></div><div class=\"it\">Оживает и включается, когда рядом что-то загорается.</div>"], "Ne": ["В любой ситуации, вещи, идее и человеке видит запас: что ещё может из этого выйти.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, какие ходы, идеи и вещи когда-то «выстрелили».</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, какие возможности обычно бывают в похожих случаях и где их принято искать.</span></div><div class=\"pr\"><b>Ситуация:</b><span>видит, что доступно именно здесь: неиспользованный ресурс, другое применение вещи, свободную нишу, скрытую способность.</span></div><div class=\"pr\"><b>Время:</b><span>видит, во что вырастет идея, проект, вещь или человек через годы, и разворачивает в голове целые ветки «если — то».</span></div><div class=\"it\">Любая ситуация для него — черновик с запасом.</div>"], "Si": ["Ощущения тела и пространства доходят поздно; в хорошо собранном месте вдруг легче думать.", "<div class=\"pr\"><b>Опыт:</b><span>только «мне сейчас хорошо или плохо», и этот сигнал приходит поздно: замёрз, сидит в неудобной позе часами, работает в комнате с гулом.</span></div><div class=\"pr no\"><b>Нормы:</b><span><i>нет</i> — не знает, как обычно делают удобно: свет, высота стола, порядок вещей.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не замечает, что этот свет, этот звук и эта мебель не сочетаются.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не предвидит, каково будет через час в этой обуви или после бессонной ночи.</span></div><div class=\"it\">Вещи выбирает по идее, а не по ощущению. Но когда кто-то настроил пространство, звук, ритм, он мгновенно узнаёт «вот это моё» и принимает без проверки.</div>"]}, "raw": {"Fi": {"Опыт": "только свои истории привязанностей: какие проекты бросил, какие города любил, какие вещи хранил, какие связи рвались.", "итог": "Отношение к проекту, городу, вещи, человеку плывёт за интересом, и упрёк «тебе всё равно» попадает в самое уязвимое.", "Нормы-": "не знает изнутри, «как положено» быть верным делу, месту, человеку.", "Ситуация-": "не видит, где дистанция уже нарушена и что здесь «чужое».", "Время-": "не чувствует, что со временем станет своим."}, "Te": {"Опыт": "помнит, какие способы сработали.", "Нормы": "знает, как принято делать хорошо — в работе, технике, общем деле, быту.", "Ситуация": "видит, как сделать именно здесь, чтобы заработало: какой инструмент, какой порядок, где срезать лишнее.", "Время": "понимает, во что выльется усилие и где будут потери.", "итог": "Всё это — на автомате и между делом. Своё умение делать дельно он не ценит и редко замечает."}, "Ni": {"Опыт": "помнит, как обычно разворачиваются истории, проекты, тренды.", "Нормы": "знает типовые сюжеты и стадии: как зреет идея, как стареет вещь, как строится дуга трека или фильма.", "Ситуация": "видит, на какой стадии именно этот процесс и что из чего тут вытекает, — может выбрать момент.", "Время-": "линию не держит как ценность: видит сюжет, но предпочитает оставить его открытым для новых ветвей.", "итог": "Умеет, но сдерживает: сюжет для него — фон, а не главное."}, "Se": {"Опыт": "помнит, когда пришлось собраться, занять место или сделать что-то весомым.", "Нормы": "знает, как «должно выглядеть» основательное: солидная вещь, уверенная подача, заметная форма, — и делает по образцу.", "Ситуация-": "не чувствует массу конкретного: сколько весит этот аргумент, эта вещь, это решение; сколько места здесь занять и когда собрать тело для рывка.", "Время-": "не держит вес на дистанции: мобилизация то есть, то нет.", "итог": "Поэтому форма и напор выходят то избыточными, то пустыми, а после такой роли он выдыхается."}, "Ti": {"Опыт": "помнит, какие объяснения и модели работали.", "Нормы": "знает принятые схемы, классификации, правила вывода.", "Ситуация": "строит систему под конкретную задачу — устройство механизма, логику проекта, структуру знания — и легко нарушает канон ради более точной модели.", "Время-": "модель строит для «сейчас» и не держится за неё, когда видит новую возможность."}, "Fe": {"Опыт": "помнит, что его заводило: музыка, событие, образ, чужой отклик.", "Нормы": "охотно перенимает образцы того, как выразить и вызвать чувство — в тексте, подаче идеи, оформлении — и рад отклику.", "итог": "Оживает и включается, когда рядом что-то загорается.", "Ситуация-": "не чувствует, где накал уместен: пишет сухо там, где нужен огонь, или горячится не к месту.", "Время-": "не выстраивает драматургию."}, "Ne": {"Опыт": "помнит, какие ходы, идеи и вещи когда-то «выстрелили».", "Нормы": "знает, какие возможности обычно бывают в похожих случаях и где их принято искать.", "Ситуация": "видит, что доступно именно здесь: неиспользованный ресурс, другое применение вещи, свободную нишу, скрытую способность.", "Время": "видит, во что вырастет идея, проект, вещь или человек через годы, и разворачивает в голове целые ветки «если — то».", "итог": "Любая ситуация для него — черновик с запасом."}, "Si": {"Опыт": "только «мне сейчас хорошо или плохо», и этот сигнал приходит поздно: замёрз, сидит в неудобной позе часами, работает в комнате с гулом.", "итог": "Вещи выбирает по идее, а не по ощущению. Но когда кто-то настроил пространство, звук, ритм, он мгновенно узнаёт «вот это моё» и принимает без проверки.", "Нормы-": "не знает, как обычно делают удобно: свет, высота стола, порядок вещей.", "Ситуация-": "не замечает, что этот свет, этот звук и эта мебель не сочетаются.", "Время-": "не предвидит, каково будет через час в этой обуви или после бессонной ночи."}}, "port": ["Как картограф неоткрытых земель: где другие видят край карты — в деле, идее или человеке, — он видит, что можно дорисовать, и тут же объясняет, как это устроено.", ["В любой ситуации, вещи, идее и человеке видит запас: другие ходы, иное применение, скрытый ресурс. Душно там, где всё уже решено.", "Раскладывает увиденное по полочкам: строит модели — механизма, проекта, идеи, — объясняет, как это устроено и что из чего следует.", "Чувства сочетаний: тела, вещей, света, звука, ритма. Мысль бежит по вариантам, а пространство вокруг собрано случайно. В хорошо настроенном месте вдруг становится легче думать.", "«Тебе всё равно», «ты ни к чему не привязан». Устойчивое «своё» — дело, место, вещь, человек — у него держится плохо."], "там, где нужно открывать и объяснять: исследования, старт проектов, новые области, разговоры о том, как всё устроено."], "polr": {"how": "«Своим» становится то, в чём есть запас: человек, дело, место, вещь. Когда возможность исчерпана, притяжение пропадает, и он не замечает, что для другой стороны связь осталась. Где дистанция уже нарушена — в разговоре, чужом пространстве, чужом деле, — не чувствует.", "hurt": "«тебе на всех плевать», «ты используешь людей как идеи», моральный приговор, требование доказать преданность.", "defend": "раскладывает логикой (БЛ): «я ничего не нарушал, давай разберём»; уходит в новую идею.", "where": "бросил проект, место, вещь, как только стало скучно, а для других это было важно; не заметил, что зашёл в чужое пространство или дело.", "why": "У Дон Кихота «своё» — то, в чём есть запас; у Жукова — то, что удержано весом. Одна дыра, но смотрят на неё из разных мест.", "short": "«своё» держится, пока есть запас"}, "rel": {"ILE": "id", "SEI": "dual", "ESE": "act", "LII": "mirror", "EIE": "ben_of", "LSI": "rev_of", "SLE": "business", "IEI": "mirage", "SEE": "super", "ILI": "ext", "LIE": "kin", "ESI": "conf", "LSE": "ben_by", "EII": "rev_by", "IEE": "quasi", "SLI": "semi"}}, "SEI": {"name": "Дюма", "ru": "СЭИ", "m": ["Si", "Fe", "Ni", "Te", "Ne", "Ti", "Se", "Fi"], "q": "Альфа", "rat": false, "dual": "ILE", "traits": ["интроверты", "сенсорики", "этики", "иррационалы", "динамики", "демократы", "весёлые", "рассудительные", "беспечные", "уступчивые", "деклатимы", "негативисты", "стратеги", "эмотивисты", "процессоры"], "lens": {"Fi": ["Безошибочно чувствует, что «своё» — место, вещь, дело, человек, — сам этого не замечая.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, что стало «своим»: места, вещи, люди, дела, привычки.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, что принято беречь и к чему держать дистанцию.</span></div><div class=\"pr\"><b>Ситуация:</b><span>точно чувствует, что сюда подходит, а что чужое: эта вещь не из этого дома, этот трек не для этого вечера, этот человек не для этого дела.</span></div><div class=\"pr\"><b>Время:</b><span>предугадывает, что станет своим, а что так и останется чужим.</span></div><div class=\"it\">Всё это — на автомате и почти без слов, поэтому сам не ценит это умение.</div>"], "Te": ["Трудно заранее рассчитать силы, затраты, результат — в работе, ремонте, учёбе, общем деле.", "<div class=\"pr\"><b>Опыт:</b><span>как сделать, чтобы сработало, понимает только после того, как однажды сделал так сам: рецепт, ремонт, бюджет, рабочий процесс.</span></div><div class=\"pr no\"><b>Нормы:</b><span><i>нет</i> — не знает стандартов: сколько это обычно стоит и сколько займёт.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не видит, где здесь лишние траты сил и денег, какой инструмент удобнее.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не просчитывает, окупится ли и что выйдет в итоге.</span></div><div class=\"it\">Поэтому требование заранее доказать, что выйдет и окупится, звучит как экзамен без шансов.</div>"], "Ni": ["Держит сюжет по образцу — «как обычно идёт» — но не чувствует, на какой стадии процесс сейчас.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, как развивались знакомые истории: чем кончались похожие проекты, как менялись вещи, места, отношения.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает типовые сюжеты: «сначала так, потом так», как обычно идёт ремонт, учёба, сезон, песня, — и строит ход дел по этому образцу.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не видит, на какой стадии именно этот процесс: если история пошла не по образцу, теряет нить и бросает её.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — изнутри не чувствует линию: созрело ли, к чему ведёт, что из чего вытекает.</span></div><div class=\"it\">Поэтому сюжет держит «как положено», по правилам, — и это утомляет, как роль.</div>"], "Se": ["Чувствует массу и форму вещей, решений, пространства, но этот вес для него не главное.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, что было весомым и основательным, а что пустым и хлипким: вещи, решения, места, люди.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, как выглядит основательное и выразительное: добротная вещь, эффектная форма, занятое место.</span></div><div class=\"pr\"><b>Ситуация:</b><span>чувствует массу и форму того, что перед ним: выдержит ли полка, достаточно ли выразительна вещь, сколько места занять, когда собраться и сделать рывок.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не выстраивает силу на дистанции: мобилизуется под момент и отпускает.</span></div><div class=\"it\">Умеет, но сдерживает: вес и напор для него не главное, а иногда лишнее.</div>"], "Ti": ["Ясность бодрит: охотно перенимает готовые системы, правила, классификации.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, какие схемы ему помогли разобраться.</span></div><div class=\"pr\"><b>Нормы:</b><span>с удовольствием перенимает готовые системы: классификации, правила сочетаний, инструкции, рецепты, структуры.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — свою систему под конкретную задачу не строит.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не выводит, к чему правило приведёт дальше.</span></div><div class=\"it\">Ясность его бодрит: ценит того, кто разложит всё по полочкам, и рад похвале за понимание.</div>"], "Fe": ["Умеет поднять или погасить накал — в общении, компании, музыке, тексте, оформлении.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, что вызывало подъём: музыка, цвет, сцена, слово, событие.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает принятые способы выразить и вызвать настроение — в тексте, музыке, оформлении, общении.</span></div><div class=\"pr\"><b>Ситуация:</b><span>поднимает или гасит накал под момент: даст треку раскачаться, уберёт кричащую деталь, разрядит сцену.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не выстраивает длинную драматургию — сезона, проекта, сета; работает на «сейчас».</span></div>"], "Ne": ["Не видит другого применения вещи, обходного пути, варианта будущего, — но оживает, когда их показывают.", "<div class=\"pr\"><b>Опыт:</b><span>только личное «моё — не моё»: чужую идею, вещь, маршрут, вариант будущего сразу чувствует как свой или чужой.</span></div><div class=\"pr no\"><b>Нормы:</b><span><i>нет</i> — не знает, где принято искать варианты.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не видит другого применения вещи, обходного пути, скрытого ресурса.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не представляет, во что что-то может вырасти.</span></div><div class=\"it\">Когда привычный ход ломается, кажется, что выхода нет. Новое принимает на веру — поэтому важно, чтобы оно приходило мягко и от того, кому он доверяет.</div>"], "Si": ["Чувствует, как сочетается всё вокруг — свет, звук, фактуры, вкус, ритм, тело, самочувствие людей рядом, — и собирает это в цельное ощущение.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, как ощущались места, вещи, материалы, звуки, еда, ритм дня — что было приятно, что резало.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, как обычно устроено то, что хорошо ощущается: свет, акустика, фактура, сочетания цветов, удобная форма.</span></div><div class=\"pr\"><b>Ситуация:</b><span>собирает конкретное «здесь» так, чтобы всё сочеталось: переставит лампу, сменит трек, поменяет ткань, сдвинет время.</span></div><div class=\"pr\"><b>Время:</b><span>заранее ощущает, каково будет в этой комнате вечером, в этой одежде через пять часов, в этом ритме через месяц; может физически почувствовать воспоминание, эскиз или описанный словами интерьер.</span></div><div class=\"it\">Поэтому хорошо делает то, где важно цельное ощущение: дизайн, звук, кухня, одежда, пространство, ритм жизни.</div>"]}, "raw": {"Fi": {"Опыт": "помнит, что стало «своим»: места, вещи, люди, дела, привычки.", "Нормы": "знает, что принято беречь и к чему держать дистанцию.", "Ситуация": "точно чувствует, что сюда подходит, а что чужое: эта вещь не из этого дома, этот трек не для этого вечера, этот человек не для этого дела.", "Время": "предугадывает, что станет своим, а что так и останется чужим.", "итог": "Всё это — на автомате и почти без слов, поэтому сам не ценит это умение."}, "Te": {"Опыт": "как сделать, чтобы сработало, понимает только после того, как однажды сделал так сам: рецепт, ремонт, бюджет, рабочий процесс.", "итог": "Поэтому требование заранее доказать, что выйдет и окупится, звучит как экзамен без шансов.", "Нормы-": "не знает стандартов: сколько это обычно стоит и сколько займёт.", "Ситуация-": "не видит, где здесь лишние траты сил и денег, какой инструмент удобнее.", "Время-": "не просчитывает, окупится ли и что выйдет в итоге."}, "Ni": {"Опыт": "помнит, как развивались знакомые истории: чем кончались похожие проекты, как менялись вещи, места, отношения.", "Нормы": "знает типовые сюжеты: «сначала так, потом так», как обычно идёт ремонт, учёба, сезон, песня, — и строит ход дел по этому образцу.", "Ситуация-": "не видит, на какой стадии именно этот процесс: если история пошла не по образцу, теряет нить и бросает её.", "Время-": "изнутри не чувствует линию: созрело ли, к чему ведёт, что из чего вытекает.", "итог": "Поэтому сюжет держит «как положено», по правилам, — и это утомляет, как роль."}, "Se": {"Опыт": "помнит, что было весомым и основательным, а что пустым и хлипким: вещи, решения, места, люди.", "Нормы": "знает, как выглядит основательное и выразительное: добротная вещь, эффектная форма, занятое место.", "Ситуация": "чувствует массу и форму того, что перед ним: выдержит ли полка, достаточно ли выразительна вещь, сколько места занять, когда собраться и сделать рывок.", "Время-": "не выстраивает силу на дистанции: мобилизуется под момент и отпускает.", "итог": "Умеет, но сдерживает: вес и напор для него не главное, а иногда лишнее."}, "Ti": {"Опыт": "помнит, какие схемы ему помогли разобраться.", "Нормы": "с удовольствием перенимает готовые системы: классификации, правила сочетаний, инструкции, рецепты, структуры.", "итог": "Ясность его бодрит: ценит того, кто разложит всё по полочкам, и рад похвале за понимание.", "Ситуация-": "свою систему под конкретную задачу не строит.", "Время-": "не выводит, к чему правило приведёт дальше."}, "Fe": {"Опыт": "помнит, что вызывало подъём: музыка, цвет, сцена, слово, событие.", "Нормы": "знает принятые способы выразить и вызвать настроение — в тексте, музыке, оформлении, общении.", "Ситуация": "поднимает или гасит накал под момент: даст треку раскачаться, уберёт кричащую деталь, разрядит сцену.", "Время-": "не выстраивает длинную драматургию — сезона, проекта, сета; работает на «сейчас»."}, "Ne": {"Опыт": "только личное «моё — не моё»: чужую идею, вещь, маршрут, вариант будущего сразу чувствует как свой или чужой.", "итог": "Когда привычный ход ломается, кажется, что выхода нет. Новое принимает на веру — поэтому важно, чтобы оно приходило мягко и от того, кому он доверяет.", "Нормы-": "не знает, где принято искать варианты.", "Ситуация-": "не видит другого применения вещи, обходного пути, скрытого ресурса.", "Время-": "не представляет, во что что-то может вырасти."}, "Si": {"Опыт": "помнит, как ощущались места, вещи, материалы, звуки, еда, ритм дня — что было приятно, что резало.", "Нормы": "знает, как обычно устроено то, что хорошо ощущается: свет, акустика, фактура, сочетания цветов, удобная форма.", "Ситуация": "собирает конкретное «здесь» так, чтобы всё сочеталось: переставит лампу, сменит трек, поменяет ткань, сдвинет время.", "Время": "заранее ощущает, каково будет в этой комнате вечером, в этой одежде через пять часов, в этом ритме через месяц; может физически почувствовать воспоминание, эскиз или описанный словами интерьер.", "итог": "Поэтому хорошо делает то, где важно цельное ощущение: дизайн, звук, кухня, одежда, пространство, ритм жизни."}}, "port": ["Как хозяин хорошего вечера и звукорежиссёр в одном лице: незаметно делает так, чтобы людям рядом было хорошо, а свет, звук, еда и настроение сложились в одно цельное ощущение.", ["Чувствует, как сочетается всё вокруг — свет, звук, фактуры, вкус, ритм, тело, самочувствие людей рядом, — и собирает это в цельное ощущение. Замечает, что «не то», раньше, чем это можно объяснить.", "Поднимает или гасит накал — в общении, компании, музыке, тексте, оформлении, событии.", "Запаса: другого применения вещи, обходного пути, варианта будущего. Сам их не ищет и неизвестности побаивается, но оживает, когда кто-то показывает: «смотри, можно и так».", "Требование заранее рассчитать результат и доказать эффективность — в работе, ремонте, бюджете. Прикинуть, сколько сил займёт дело и окупится ли оно, ему трудно."], "там, где важно цельное ощущение — для людей и пространства: дизайн, звук, кухня, одежда, забота о самочувствии, атмосфера события, ритм жизни."], "polr": {"how": "Результат проверяет телом: если делать «эффективно» неприятно, это кажется неправильным. Не видит, где лишние траты сил, времени, материала, сколько вложено и что выйдет.", "hurt": "«от тебя никакого толку», оценка по цифрам, требование технологий и отчётов, «займись наконец делом».", "defend": "делает по-своему, «чтобы было хорошо», сглаживает настроением (ЧЭ), откладывает.", "where": "ремонт, учёба, работа, техника, где нужен порядок шагов и расчёт; тратит много сил на то, что можно было сделать проще.", "why": "Дюма проверяет результат телом и самочувствием, Есенин — сюжетом. Первый не делает «эффективно», если это неприятно; второй — пока «не созрело».", "short": "«эффективно» не делает, если неприятно"}, "rel": {"ILE": "dual", "SEI": "id", "ESE": "mirror", "LII": "act", "EIE": "rev_of", "LSI": "ben_of", "SLE": "mirage", "IEI": "business", "SEE": "ext", "ILI": "super", "LIE": "conf", "ESI": "kin", "LSE": "rev_by", "EII": "ben_by", "IEE": "semi", "SLI": "quasi"}}, "ESE": {"name": "Гюго", "ru": "ЭСЭ", "m": ["Fe", "Si", "Te", "Ni", "Ti", "Ne", "Fi", "Se"], "q": "Альфа", "rat": true, "dual": "LII", "traits": ["экстраверты", "сенсорики", "этики", "рационалы", "динамики", "демократы", "весёлые", "рассудительные", "предусмотрительные", "упрямые", "деклатимы", "позитивисты", "тактики", "конструктивисты", "результаторы"], "lens": {"Fi": ["Чувствует, что своё, а что чужое, но сдерживает это.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, что стало своим, а что чужим.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, что принято беречь и где держать дистанцию.</span></div><div class=\"pr\"><b>Ситуация:</b><span>точно чувствует, что здесь своё, а что чужое: вещь, место, дело, человек.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — устойчивую привязанность не делает мерилом: живой подъём для него важнее.</span></div><div class=\"it\">Умеет, но сдерживает. В ссоре этой силой может ударить точно.</div>"], "Te": ["Деловитость изображает по образцу и быстро от неё устаёт.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, какие способы срабатывали.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, «как положено» делать эффективно, и делает по образцу.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не видит, как сделать именно здесь, чтобы заработало без лишних трат.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не просчитывает, во что выльется усилие.</span></div><div class=\"it\">Деловитость изображает по правилам — и быстро от неё устаёт.</div>"], "Ni": ["Процесс видит как череду ярких моментов без линии; «к чему это всё?» ранит.", "<div class=\"pr\"><b>Опыт:</b><span>только своё: какие истории неожиданно обрывались, какие затягивались.</span></div><div class=\"pr no\"><b>Нормы:</b><span><i>нет</i> — не знает изнутри типовых стадий: как зреет проект, как стареет вещь, как раз ято создавать подъём — в событии, тексте, оформлении, общении.</span></div><div class=\"pr\"><b>Ситуация:</b><span>чувствует накал конкретного момента и поднимает его: громче, ярче, живее — в компании, деле, пространстве.</span></div><div class=\"pr\"><b>Время:</b><span>видит, как будет нарастать и спадать заряд — вечера, проекта, сезона — и ведёт его к пику.</span></div><div class=\"it\">Через эту оптику он смотрит на мир: живо то, что горит.</div>"], "Ne": ["Сам запас не ищет, но новый ход от другого бодрит.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, какие неожиданные ходы срабатывали.</span></div><div class=\"pr\"><b>Нормы:</b><span>охотно перенимает чужие варианты и идеи.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — сам не видит запаса конкретного: другого применения вещи, обходного пути.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не разворачивает ветки «если — то».</span></div><div class=\"it\">Новый ход от другого бодрит: подъёму есть куда двигаться.</div>"], "Si": ["Собирает свет, звук, вкус, фактуры и ритм так, чтобы людям было хорошо, а ощущение усиливало подъём.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, что сочеталось и хорошо ощущалось: вкус, свет, ткань, звук, ритм.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, как устроено приятное: освещение, фактура, температура, удобная форма, сочетание вкусов.</span></div><div class=\"pr\"><b>Ситуация:</b><span>собирает конкретное «здесь» так, чтобы ощущение усиливало подъём: поменяет свет, добавит музыку, переставит стол.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — самочувствие надолго не выстраивает: настраивает под момент и под событие.</span></div>"]}, "raw": {"Fi": {"Опыт": "помнит, что стало своим, а что чужим.", "Нормы": "знает, что принято беречь и где держать дистанцию.", "Ситуация": "точно чувствует, что здесь своё, а что чужое: вещь, место, дело, человек.", "Время-": "устойчивую привязанность не делает мерилом: живой подъ
