    return `<div class="vpanel" data-v="${i}" ${i ? 'hidden' : ''} style="--c:${D.cult.QC[q]}">
      <h2 style="color:${D.cult.QC[q]};margin:8px 0 4px">${q}</h2><div class="lead">${Q.v}</div>
      <div class="kicker" style="margin:12px 0 6px">${lay(0)} Четыре ценных аспекта</div>
      <div class="cards" style="grid-template-columns:repeat(2,minmax(0,1fr))">${val.map(a => `<div class="card" style="--c:var(--${a})"><h4><span class="c">${D.syms[a]} ${D.colname[a]} · ${D.ab[a]}</span> <span class="m">«${D.tag[a]}»</span></h4><p class="sm mut">Обычно отвечает за: ${POP[a]}.</p><p class="sm">${D.core ? (D.core[a] || '') : ''}</p></div>`).join('')}</div>
      <div class="vgrid" style="margin-top:12px"><div class="vc"><div class="kicker">${lay(2)} Как это звучит вместе</div><p>${Q.l}</p></div>
        <div class="vc"><div class="kicker">${lay(2)} Что для квадры фон</div><p>${bg.map(a => `<b style="color:var(--${a})">${D.ab[a]}</b>`).join(' · ')}</p><p class="sm">${Q.bg}</p></div>
        <div class="vc"><div class="kicker">${lay(3)} Где квадре легко</div><p class="sm">${Q.g}</p></div>
        <div class="vc"><div class="kicker">${lay(0)} Типы квадры</div><p>${ks.map(k => `<a href="#type-${k.toLowerCase()}" style="color:var(--${T[k].m[0]})">${T[k].name}</a> <span class="sm mut">${D.ab[T[k].m[0]]}+${D.ab[T[k].m[1]]}</span>`).join('<br>')}</p></div></div></div>`; }).join('');
  const heat = `<div class="tw"><table class="heat qheat"><tr><th></th>${AORD.map(a => `<th style="color:var(--${a})">${D.syms[a]}<br>${D.ab[a]}</th>`).join('')}</tr>${QORDER.map(q => `<tr><td><b style="color:${D.cult.QC[q]}">${q}</b></td>${AORD.map(a => `<td><span class="hc" style="--c:var(--${a});opacity:${D.cult.Q[q].includes(a) ? 1 : .08}">${D.cult.Q[q].includes(a) ? '●' : ''}</span></td>`).join('')}</tr>`).join('')}</table></div>`;
  return `<div class="hero"><div><div class="kicker">Соционика · квадры</div><h1>Четыре квадры</h1>
    <div class="lead">Квадра — четыре типа, которым важны одни и те же четыре аспекта. Не компания и не характер, а общий язык того, что имеет значение.</div>
    <p class="sm mut">${lay(0)}Квадры и их ценности — по Аугустинавичюте. ${lay(2)}Описания «как звучит вместе», «фон», «где легко» — моя линза. ${lay(3)}Связь с группами и средой — гипотеза.</p></div></div>
  <div class="sheet"><div class="kicker">${lay(0)} Откуда берутся квадры</div><h2>Два выбора — четыре квадры</h2>
    <p>${lay(0)}У каждого типа ценны четыре функции: две сильные в эго (ведущая и творческая) и две желанные в сверх-оно (суггестивная и активационная). У четырёх типов этот набор совпадает — это и есть квадра.</p>
    <p>${lay(0)}Выбор у квадры всего из двух пар на каждой оси. Чем оценивать: мерой и зажиганием (БЛ+ЧЭ) или КПД и гравитацией (ЧЛ+БЭ). Что воспринимать: запасом и самочувствием (ЧИ+БС) или весом и сюжетом (ЧС+БИ). Два выбора — четыре квадры.</p>
    ${heat}</div>
  <div class="sheet" id="qviz"><div class="kicker">Интерактивная визуализация · от общего к частному</div><h2>Квадры → квадра → пара → тип</h2>
    <p class="sm">Нажми на квадру, чтобы увидеть, как устроены отношения внутри неё. Нажми на линию между типами — откроется, как работает эта пара. Нажми на тип — его страница.</p>
    <div class="qcrumb" id="qcrumb"></div><div class="qstage" id="qstage">${qVizTop()}</div><div id="qpair"></div>
    <div class="qlegend sm"><span><i style="background:var(--good)"></i>дуальность — дополнение по всем каналам</span><span><i style="background:var(--Ne)"></i>активация — бодрит, но не насыщает</span><span><i style="background:var(--Te)"></i>зеркальные — одно и то же с разных сторон</span></div>
    <p class="sm" style="margin-top:8px">${lay(0)}Внутри квадры всего три вида отношений, по две пары каждого: дуальность, активация, зеркальные. Это единственное место, где все отношения «свои»: общие ценности есть у всех шестерых пар.</p></div>
  <div class="sheet" id="qdet"><div class="kicker">Каждая квадра</div><h2>Ценности, фон и типы</h2><div class="vtabs">${tabs}</div>${panels}</div>
  <div class="sheet"><div class="kicker">Клише</div><h2>Чем квадра не является</h2>
    <div class="tw"><table class="ptab"><tr><th>Клише</th><th>Что на самом деле</th></tr>${QCL.map(([a,b]) => `<tr><td class="mut"><s>${a}</s></td><td>${b}</td></tr>`).join('')}</table></div></div>`;
}
function qGo(level, arg){
  const st = document.getElementById('qstage'), cr = document.getElementById('qcrumb'), pr = document.getElementById('qpair'); if (!st) return;
  if (level === 0) { st.innerHTML = qVizTop(); cr.innerHTML = ''; pr.innerHTML = ''; return; }
  const qi = +arg, q = QORDER[qi];
  st.innerHTML = qVizQuad(qi); pr.innerHTML = '';
  cr.innerHTML = `<button type="button" class="tbtn ghost" data-qback>← все квадры</button> <b style="color:${D.cult.QC[q]}">${q}</b> <span class="sm mut">${D.cult.QT[q]}</span>`;
}
document.addEventListener('click', e => {
  const n = e.target.closest('.qnode'); if (n) { qGo(1, n.dataset.q); return; }
  if (e.target.closest('[data-qback]')) { qGo(0); return; }
  const p = e.target.closest('.qpair'); if (p) { document.getElementById('qpair').innerHTML = qVizPair(p.dataset.a, p.dataset.b); document.getElementById('qpair').scrollIntoView({block:'nearest'}); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest && e.target.closest('.qnode,.qpair')) e.target.closest('.qnode,.qpair').dispatchEvent(new MouseEvent('click', {bubbles:true})); });
// ---------- страница: основы (бывший справочник, встраивается при сборке)
const BASICS = "<section id=\"layers-map\" style=\"border-top:none;padding-top:20px\">\n  <div class=\"kicker\">Из чего собрана система</div>\n  <h2>Ядро и надстройки</h2>\n  <div class=\"intro\"><p>Всё здесь разложено по слоям. Ниже лежит то, из чего строится соционика; выше — развития и интерпретации. Переключатель над этим блоком прячет верхние слои, чтобы прочитать систему только по основанию.</p></div>\n  <div class=\"stack\">\n    <div><span class=\"lay l0\">ядро</span><h4>Аугустинавичюте</h4><p>Информационный метаболизм, восемь аспектов в её определениях, модель А, интертипные отношения, квадры, дихотомии Юнга.</p></div>\n    <div><span class=\"lay l1\">классика</span><h4>После неё, общепринятое</h4><p>Мерность функций (Букалов). Признаки Рейнина: принадлежность выводится строго, описания у авторов расходятся.</p></div>\n    <div><span class=\"lay l2\">линза</span><h4>Моя интерпретация</h4><p>Ярлыки аспектов (вес, сюжет, гравитация…), широкие объекты, разбор по параметрам, болевая через ведущую, образы мест.</p></div>\n    <div><span class=\"lay l3\">гипотеза</span><h4>Гипотезы</h4><p>Вес типа и слои личности, связь ценностей Шварца с аспектами, культуры, совместимость вариантов. Цифры там условные.</p></div>\n  </div>\n</section><section id=\"system\">\n  <div class=\"kicker\">Как устроена система</div>\n  <h2>Четыре уровня, каждый опирается на предыдущий</h2>\n  <div class=\"map\">\n    <a href=\"#aspects\"><span class=\"kicker\" style=\"margin:0\">1 · Язык</span><span class=\"n\">Аспекты, модель А, мерность</span><span class=\"arrow\">восемь сторон мира, восемь мест в психике, четыре параметра</span></a>\n    <a href=\"#types\"><span class=\"kicker\" style=\"margin:0\">2 · Типы</span><span class=\"n\">16 типов и их болевые</span><span class=\"arrow\">как аспекты расставлены у конкретного человека</span></a>\n    <a href=\"#relations\"><span class=\"kicker\" style=\"margin:0\">3 · Отношения</span><span class=\"n\">Дуальность, ревизия, активация</span><span class=\"arrow\">что происходит, когда две модели стыкуются</span></a>\n    <a href=\"#beyond\"><span class=\"kicker\" style=\"margin:0\">4 · Вне типа</span><span class=\"n\">Слои личности и культуры</span><span class=\"arrow\">что тип задаёт, а что нет</span></a>\n  </div>\n  <p class=\"mut\">Документы серии — это углублённые разборы. Всё, что в них повторяется (аспекты, места, мерность), собрано здесь один раз.</p>\n</section><section id=\"aspects\">\n  <div class=\"kicker\">Язык · 1</div>\n  <h2>Восемь аспектов — восемь сторон мира</h2>\n  <div class=\"intro\"><p data-layer=\"0\"><span class=\"lay l0\">ядро</span> Аугустинавичюте называла тип типом информационного метаболизма: способом, которым психика принимает сигналы мира. Четыре <b>чёрных</b> аспекта описывают объект сам по себе (потенциал, процесс, движение, работа), четыре <b>белых</b> — отношения (пространство, время, мера, притяжение). Ниже её определения, пересказанные близко к тексту.</p>\n  <p data-layer=\"2\"><span class=\"lay l2\">линза</span> Объекты у всех аспектов одинаково широки: вещи, тело, пространство, идеи, процессы, дела, люди. Ярлык в кавычках — моё короткое имя аспекта; строка «в пересказах» показывает, во что аспект обычно сводят.</p></div>\n  <div class=\"grid2\"><article class=\"asp\" style=\"--c:var(--Ne)\">\n  <header><svg class=\"sym\" width=\"22\" height=\"22\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><polygon points=\"0,-8 8,6 -8,6\" fill=\"var(--Ne)\"/></svg><div><h3>Чёрная интуиция · ЧИ</h3><div class=\"tag\">Интуиция возможностей · иррациональный</div></div></header>\n  <div data-layer=\"0\" class=\"blk\"><span class=\"lay l0\">ядро</span><p>Потенциал объекта: его внутренняя суть, способности, то, чем он может стать.</p></div>\n  <div data-layer=\"2\" class=\"blk\"><span class=\"lay l2\">линза</span><p><b class=\"c\">«запас».</b> Видеть запас: на что ещё способны вещь, человек, идея или положение, чем они могут стать, какие есть другие выходы.</p>\n  <p class=\"img\">Как фонарик, который везде находит двери.</p>\n  <p class=\"cl\"><span class=\"mut\">В пересказах:</span> <s>креатив и перспективы</s> → запас: на что ещё способны вещь, человек, идея, положение</p></div>\n</article><article class=\"asp\" style=\"--c:var(--Fe)\">\n  <header><svg class=\"sym\" width=\"22\" height=\"22\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><path d=\"M-7 -7 H0 V0 H7 V7 H-7 Z\" fill=\"var(--Fe)\"/></svg><div><h3>Чёрная этика · ЧЭ</h3><div class=\"tag\">Этика эмоций · рациональный</div></div></header>\n  <div data-layer=\"0\" class=\"blk\"><span class=\"lay l0\">ядро</span><p>Внутренний процесс объекта: возбуждение, переход энергии из потенциальной в движение.</p></div>\n  <div data-layer=\"2\" class=\"blk\"><span class=\"lay l2\">линза</span><p><b class=\"c\">«зажигание».</b> Чувствовать заряд: что разгорается, что гаснет, где «может быть» переходит в «началось», — и уметь поднять или погасить накал.</p>\n  <p class=\"img\">Как спичка: чувствует, где можно разжечь.</p>\n  <p class=\"cl\"><span class=\"mut\">В пересказах:</span> <s>эмоции и настроение</s> → зажигание: что разгорается и что гаснет — в событии, тексте, проекте, месте</p></div>\n</article><article class=\"asp\" style=\"--c:var(--Se)\">\n  <header><svg class=\"sym\" width=\"22\" height=\"22\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><circle cx=\"0\" cy=\"0\" r=\"7\" fill=\"var(--Se)\"/></svg><div><h3>Чёрная сенсорика · ЧС</h3><div class=\"tag\">Волевая сенсорика · иррациональный</div></div></header>\n  <div data-layer=\"0\" class=\"blk\"><span class=\"lay l0\">ядро</span><p>Кинетическая энергия: движение объекта в пространстве, его внешняя форма и сила.</p></div>\n  <div data-layer=\"2\" class=\"blk\"><span class=\"lay l2\">линза</span><p><b class=\"c\">«вес».</b> Чувствовать массу и форму: сколько что весит, сколько занимает места, готово ли прямо сейчас тратить силу, выразительно ли.</p>\n  <p class=\"img\">Как руки, которые чувствуют вес.</p>\n  <p class=\"cl\"><span class=\"mut\">В пересказах:</span> <s>воля, давление, власть, напор</s> → вес: масса, форма, выразительность, готовность собраться для рывка — у вещей, решений, пространства, тела</p></div>\n</article><article class=\"asp\" style=\"--c:var(--Te)\">\n  <header><svg class=\"sym\" width=\"22\" height=\"22\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><rect x=\"-7\" y=\"-7\" width=\"14\" height=\"14\" fill=\"var(--Te)\"/></svg><div><h3>Чёрная логика · ЧЛ</h3><div class=\"tag\">Деловая логика · рациональный</div></div></header>\n  <div data-layer=\"0\" class=\"blk\"><span class=\"lay l0\">ядро</span><p>Использование энергии: внешняя работа объекта, его действие и результат.</p></div>\n  <div data-layer=\"2\" class=\"blk\"><span class=\"lay l2\">линза</span><p><b class=\"c\">«КПД».</b> Видеть, во что превращается энергия: вложенное усилие, полученный результат, потери по дороге.</p>\n  <p class=\"img\">Как мастер, который видит, что выйдет из заготовки.</p>\n  <p class=\"cl\"><span class=\"mut\">В пересказах:</span> <s>деньги и работа</s> → КПД: во что превращается усилие — в деле, технике, теле, быту</p></div>\n</article><article class=\"asp\" style=\"--c:var(--Si)\">\n  <header><svg class=\"sym\" width=\"22\" height=\"22\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><circle cx=\"0\" cy=\"0\" r=\"7\" fill=\"none\" stroke=\"var(--Si)\" stroke-width=\"1.7\"/></svg><div><h3>Белая сенсорика · БС</h3><div class=\"tag\">Сенсорика ощущений · иррациональный</div></div></header>\n  <div data-layer=\"0\" class=\"blk\"><span class=\"lay l0\">ядро</span><p>Пространство, как его ощущает субъект: взаимодействие с ним, самочувствие, равновесие.</p></div>\n  <div data-layer=\"2\" class=\"blk\"><span class=\"lay l2\">линза</span><p><b class=\"c\">«самочувствие».</b> Чувствовать, как сочетается всё, что есть одновременно: тело, свет, звук, вещи, процессы — и каково от этого.</p>\n  <p class=\"img\">Как звукорежиссёр, который слышит весь зал сразу.</p>\n  <p class=\"cl\"><span class=\"mut\">В пересказах:</span> <s>уют и комфорт</s> → самочувствие: как сочетается всё, что есть одновременно — тело, свет, звук, вещи, процессы</p></div>\n</article><article class=\"asp\" style=\"--c:var(--Ni)\">\n  <header><svg class=\"sym\" width=\"22\" height=\"22\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><polygon points=\"0,-8 8,6 -8,6\" fill=\"none\" stroke=\"var(--Ni)\" stroke-width=\"1.7\"/></svg><div><h3>Белая интуиция · БИ</h3><div class=\"tag\">Интуиция времени · иррациональный</div></div></header>\n  <div data-layer=\"0\" class=\"blk\"><span class=\"lay l0\">ядро</span><p>Время: последовательность событий и связь между ними.</p></div>\n  <div data-layer=\"2\" class=\"blk\"><span class=\"lay l2\">линза</span><p><b class=\"c\">«сюжет».</b> Видеть линию: что из чего вытекает, на какой стадии процесс, созрело ли, пора или рано.</p>\n  <p class=\"img\">Как читатель, который знает, к чему идёт сюжет.</p>\n  <p class=\"cl\"><span class=\"mut\">В пересказах:</span> <s>сроки, пунктуальность, прогнозы</s> → сюжет: что из чего вытекает, на какой стадии процесс, созрело ли</p></div>\n</article><article class=\"asp\" style=\"--c:var(--Ti)\">\n  <header><svg class=\"sym\" width=\"22\" height=\"22\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><rect x=\"-7\" y=\"-7\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"var(--Ti)\" stroke-width=\"1.7\"/></svg><div><h3>Белая логика · БЛ</h3><div class=\"tag\">Структурная логика · рациональный</div></div></header>\n  <div data-layer=\"0\" class=\"blk\"><span class=\"lay l0\">ядро</span><p>Объективное соотношение объектов: мера, структура, иерархия.</p></div>\n  <div data-layer=\"2\" class=\"blk\"><span class=\"lay l2\">линза</span><p><b class=\"c\">«мера».</b> Держать мир в пропорции: что чему равно, что к какому классу относится, что чему противоречит.</p>\n  <p class=\"img\">Как линейка: что больше, что меньше, что лишнее.</p>\n  <p class=\"cl\"><span class=\"mut\">В пересказах:</span> <s>порядок и правила</s> → мера: что чему соответствует, к какому классу относится, где противоречие</p></div>\n</article><article class=\"asp\" style=\"--c:var(--Fi)\">\n  <header><svg class=\"sym\" width=\"22\" height=\"22\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><path d=\"M-7 -7 H0 V0 H7 V7 H-7 Z\" fill=\"none\" stroke=\"var(--Fi)\" stroke-width=\"1.7\"/></svg><div><h3>Белая этика · БЭ</h3><div class=\"tag\">Этика отношений · рациональный</div></div></header>\n  <div data-layer=\"0\" class=\"blk\"><span class=\"lay l0\">ядро</span><p>Субъективное отношение объектов: притяжение и отталкивание между ними.</p></div>\n  <div data-layer=\"2\" class=\"blk\"><span class=\"lay l2\">линза</span><p><b class=\"c\">«гравитация».</b> Чувствовать силу и знак притяжения: что своё, что чужое, что к чему тянется, какая между всем дистанция.</p>\n  <p class=\"img\">Как магнит: что своё, что чужое.</p>\n  <p class=\"cl\"><span class=\"mut\">В пересказах:</span> <s>отношения с людьми, мораль</s> → гравитация: что своё, что чужое, какая дистанция — к людям, местам, делам, вещам, идеям</p></div>\n</article></div>\n</section><section id=\"model\">\n  <div class=\"kicker\">Язык · 2</div>\n  <h2>Модель А: место меняет, как работает аспект</h2>\n  <div class=\"intro\"><p data-layer=\"0\"><span class=\"lay l0\">ядро</span> Все восемь аспектов есть у каждого, но стоят на разных местах модели А. Место решает, сильный аспект или слабый и ценный или нет. Четыре блока: эго, сверх-я, сверх-оно, оно.</p>\n  <p data-layer=\"1\"><span class=\"lay l1\">классика</span> Колонка мерности — по Букалову. <span data-layer=\"2\"><span class=\"lay l2\">линза</span> Колонка образов — моя: восемь языков, которыми человек владеет по-разному.</span></p></div>\n  <div class=\"tw\"><table><tr><th>Место · блок · сила и ценность</th><th data-layer=\"1\">Мерность</th><th data-layer=\"2\">Образ и как работает</th></tr><tr><td><b>1 · Ведущая</b><div class=\"mut\">эго · сильная, ценная</div></td><td data-layer=\"1\"><span class=\"dots\" aria-label=\"4D\"><i class=\"on\"></i><i class=\"on\"></i><i class=\"on\"></i><i class=\"on\"></i></span> <span class=\"mut\">4D</span></td><td data-layer=\"2\"><span class=\"mut\">«родной язык»</span><br>сильная и ценная: через неё человек смотрит на мир</td></tr><tr><td><b>2 · Творческая</b><div class=\"mut\">эго · сильная, ценная</div></td><td data-layer=\"1\"><span class=\"dots\" aria-label=\"3D\"><i class=\"on\"></i><i class=\"on\"></i><i class=\"on\"></i><i class=\"\"></i></span> <span class=\"mut\">3D</span></td><td data-layer=\"2\"><span class=\"mut\">«рабочий язык»</span><br>сильная и ценная: инструмент, гибко отступает от правил ради результата</td></tr><tr><td><b>3 · Ролевая</b><div class=\"mut\">сверх-я · слабая, не ценная</div></td><td data-layer=\"1\"><span class=\"dots\" aria-label=\"2D\"><i class=\"on\"></i><i class=\"on\"></i><i class=\"\"></i><i class=\"\"></i></span> <span class=\"mut\">2D</span></td><td data-layer=\"2\"><span class=\"mut\">«фразы из разговорника»</span><br>слабая, но осознанная: действует «по учебнику», держит лицо через усилие</td></tr><tr><td><b>4 · Болевая</b><div class=\"mut\">сверх-я · слабая, не ценная</div></td><td data-layer=\"1\"><span class=\"dots\" aria-label=\"1D\"><i class=\"on\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span> <span class=\"mut\">1D</span></td><td data-layer=\"2\"><span class=\"mut\">«язык, на котором стыдно ошибиться»</span><br>слабая и уязвимая: только личный опыт, критика ранит сильнее всего</td></tr><tr><td><b>5 · Суггестивная</b><div class=\"mut\">сверх-оно · слабая, ценная</div></td><td data-layer=\"1\"><span class=\"dots\" aria-label=\"1D\"><i class=\"on\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span> <span class=\"mut\">1D</span></td><td data-layer=\"2\"><span class=\"mut\">«язык, который любишь слушать»</span><br>слабая и ценная: жажда этой информации, принимает почти без проверки</td></tr><tr><td><b>6 · Активационная</b><div class=\"mut\">сверх-оно · слабая, ценная</div></td><td data-layer=\"1\"><span class=\"dots\" aria-label=\"2D\"><i class=\"on\"></i><i class=\"on\"></i><i class=\"\"></i><i class=\"\"></i></span> <span class=\"mut\">2D</span></td><td data-layer=\"2\"><span class=\"mut\">«язык, который учишь с удовольствием»</span><br>слабая и ценная: помощь бодрит и подталкивает к действию</td></tr><tr><td><b>7 · Ограничительная</b><div class=\"mut\">оно · сильная, не ценная</div></td><td data-layer=\"1\"><span class=\"dots\" aria-label=\"3D\"><i class=\"on\"></i><i class=\"on\"></i><i class=\"on\"></i><i class=\"\"></i></span> <span class=\"mut\">3D</span></td><td data-layer=\"2\"><span class=\"mut\">«знаешь, но молчишь»</span><br>сильная, но не ценная: умеет, но сдерживает себя</td></tr><tr><td><b>8 · Демонстративная</b><div class=\"mut\">оно · сильная, не ценная</div></td><td data-layer=\"1\"><span class=\"dots\" aria-label=\"4D\"><i class=\"on\"></i><i class=\"on\"></i><i class=\"on\"></i><i class=\"on\"></i></span> <span class=\"mut\">4D</span></td><td data-layer=\"2\"><span class=\"mut\">«говоришь во сне»</span><br>сильная, но не ценная: на автомате и незаметно для себя</td></tr></table></div>\n</section><section id=\"dimension\" data-layer=\"1\">\n  <div class=\"kicker\">Язык · 3</div>\n  <h2>Мерность: четыре параметра функции</h2>\n  <div class=\"intro\"><p><span class=\"lay l1\">классика</span> Мерность предложил А. Букалов уже после Аугустинавичюте. Каждый следующий параметр добавляется к предыдущим: 1D — только опыт, 4D — опыт, нормы, ситуация и время. </p><p data-layer=\"2\"><span class=\"lay l2\">линза</span> В разборах каждая функция описывается построчно по этим параметрам, а недостающие отмечены «нет — и вот что из этого следует».</p></div>\n  <div class=\"pars\"><div class=\"par\"><h4>1. Опыт</h4><p>То, что человек сам пережил и проверил на себе. Есть у любой функции.</p><p class=\"mut\">Без других параметров опыт узок: судит только по себе.</p></div><div class=\"par\"><h4>2. Нормы</h4><p>Общепринятые правила и образцы, «как принято». Функция может учиться у других и сверяться с эталоном.</p><p class=\"mut\">Без ситуации нормы превращаются в учебник: правильно, но негибко.</p></div><div class=\"par\"><h4>3. Ситуация</h4><p>Видеть конкретные обстоятельства здесь и сейчас и отступать от правил, если случай того требует.</p><p class=\"mut\">Без времени: как поступить сейчас — ясно, к чему это приведёт — нет.</p></div><div class=\"par\"><h4>4. Время</h4><p>Видеть развитие: откуда всё пришло, куда идёт, предвидеть последствия.</p><p class=\"mut\">С этим параметром функция становится мировоззрением.</p></div></div>\n  <p class=\"mut\" style=\"margin-top:14px\">Мерность — не «ум» функции. 1D болевая и 1D суггестивная обе знают только опыт, но первая боится ошибки, а вторая просто ждёт подсказки.</p>\n</section><section id=\"rationality\">\n  <div class=\"kicker\">Язык · 4</div>\n  <h2>Рациональность и иррациональность</h2>\n  <div class=\"intro\"><p data-layer=\"0\"><span class=\"lay l0\">ядро</span> Рациональные аспекты — логика и этика (БЛ, ЧЛ, БЭ, ЧЭ) — оценивают. Иррациональные — сенсорика и интуиция (ЧС, БС, ЧИ, БИ) — воспринимают. Тип рационален, если ведущая функция оценивающая. Слова взяты у Юнга: <i>ratio</i> здесь — суждение, а не «разумность».</p></div>\n  <div class=\"ratio\" data-layer=\"2\">\n    <div><h4>Рационал</h4><p><span class=\"lay l2\">линза</span> Сначала выносит суждение и держится его, даже если обстановка меняется. Мир — то, что нужно оценить и упорядочить.</p></div>\n    <div><h4>Иррационал</h4><p><span class=\"lay l2\">линза</span> Сначала принимает, что есть, и пересматривает решение, когда меняется картина. Мир — то, что нужно сначала увидеть.</p></div>\n  </div>\n  <p data-layer=\"0\"><span class=\"lay l0\">ядро</span> Дуалы всегда одинаковы по этому признаку. Болевая у рационала — всегда воспринимающий аспект, у иррационала — оценивающий.</p>\n</section><section id=\"quadras\">\n  <div class=\"kicker\">Язык · 5</div>\n  <h2>Квадры: четыре набора ценностей</h2>\n  <div class=\"intro\"><p><span class=\"lay l0\">ядро</span> Каждая квадра ценит два рациональных и два иррациональных аспекта. Выбор всего из двух пар: оценивать мерой и зажиганием (БЛ + ЧЭ) или КПД и гравитацией (ЧЛ + БЭ); воспринимать запас и самочувствие (ЧИ + БС) или вес и сюжет (ЧС + БИ).</p></div>\n  <div class=\"quads\"><div class=\"quad\"><h4>Альфа</h4><div class=\"qs\"><svg class=\"sym\" width=\"16\" height=\"16\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><polygon points=\"0,-7.5 7.5,5.5 -7.5,5.5\" fill=\"var(--Ne)\"/></svg><svg class=\"sym\" width=\"16\" height=\"16\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><rect x=\"-6.5\" y=\"-6.5\" width=\"13.0\" height=\"13.0\" fill=\"none\" stroke=\"var(--Ti)\" stroke-width=\"1.7\"/></svg><svg class=\"sym\" width=\"16\" height=\"16\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><circle cx=\"0\" cy=\"0\" r=\"6.5\" fill=\"none\" stroke=\"var(--Si)\" stroke-width=\"1.7\"/></svg><svg class=\"sym\" width=\"16\" height=\"16\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><path d=\"M-6.5 -6.5 H0 V0 H6.5 V6.5 H-6.5 Z\" fill=\"var(--Fe)\"/></svg></div><p>запас · мера · самочувствие · зажигание</p><p class=\"mut\">Дон Кихот, Дюма, Гюго, Робеспьер</p></div><div class=\"quad\"><h4>Бета</h4><div class=\"qs\"><svg class=\"sym\" width=\"16\" height=\"16\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><rect x=\"-6.5\" y=\"-6.5\" width=\"13.0\" height=\"13.0\" fill=\"none\" stroke=\"var(--Ti)\" stroke-width=\"1.7\"/></svg><svg class=\"sym\" width=\"16\" height=\"16\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><path d=\"M-6.5 -6.5 H0 V0 H6.5 V6.5 H-6.5 Z\" fill=\"var(--Fe)\"/></svg><svg class=\"sym\" width=\"16\" height=\"16\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><circle cx=\"0\" cy=\"0\" r=\"6.5\" fill=\"var(--Se)\"/></svg><svg class=\"sym\" width=\"16\" height=\"16\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><polygon points=\"0,-7.5 7.5,5.5 -7.5,5.5\" fill=\"none\" stroke=\"var(--Ni)\" stroke-width=\"1.7\"/></svg></div><p>мера · зажигание · вес · сюжет</p><p class=\"mut\">Гамлет, Максим, Жуков, Есенин</p></div><div class=\"quad\"><h4>Гамма</h4><div class=\"qs\"><svg class=\"sym\" width=\"16\" height=\"16\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><circle cx=\"0\" cy=\"0\" r=\"6.5\" fill=\"var(--Se)\"/></svg><svg class=\"sym\" width=\"16\" height=\"16\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><polygon points=\"0,-7.5 7.5,5.5 -7.5,5.5\" fill=\"none\" stroke=\"var(--Ni)\" stroke-width=\"1.7\"/></svg><svg class=\"sym\" width=\"16\" height=\"16\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><path d=\"M-6.5 -6.5 H0 V0 H6.5 V6.5 H-6.5 Z\" fill=\"none\" stroke=\"var(--Fi)\" stroke-width=\"1.7\"/></svg><svg class=\"sym\" width=\"16\" height=\"16\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><rect x=\"-6.5\" y=\"-6.5\" width=\"13.0\" height=\"13.0\" fill=\"var(--Te)\"/></svg></div><p>вес · гравитация · сюжет · КПД</p><p class=\"mut\">Наполеон, Бальзак, Джек Лондон, Драйзер</p></div><div class=\"quad\"><h4>Дельта</h4><div class=\"qs\"><svg class=\"sym\" width=\"16\" height=\"16\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><polygon points=\"0,-7.5 7.5,5.5 -7.5,5.5\" fill=\"var(--Ne)\"/></svg><svg class=\"sym\" width=\"16\" height=\"16\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><circle cx=\"0\" cy=\"0\" r=\"6.5\" fill=\"none\" stroke=\"var(--Si)\" stroke-width=\"1.7\"/></svg><svg class=\"sym\" width=\"16\" height=\"16\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><path d=\"M-6.5 -6.5 H0 V0 H6.5 V6.5 H-6.5 Z\" fill=\"none\" stroke=\"var(--Fi)\" stroke-width=\"1.7\"/></svg><svg class=\"sym\" width=\"16\" height=\"16\" viewBox=\"-9 -9 18 18\" aria-hidden=\"true\"><rect x=\"-6.5\" y=\"-6.5\" width=\"13.0\" height=\"13.0\" fill=\"var(--Te)\"/></svg></div><p>запас · гравитация · самочувствие · КПД</p><p class=\"mut\">Штирлиц, Достоевский, Гексли, Габен</p></div></div>\n  <div class=\"docs\" style=\"margin-top:16px\" data-layer=\"3\"></div>\n</section><section id=\"types\">\n  <div class=\"kicker\">Типы</div>\n  <h2>Шестнадцать типов</h2>\n  <div class=\"intro\"><p><span class=\"lay l0\">ядро</span> Выбери тип: модель А, квадра, рациональность, ключевые отношения. Модель и отношения рассчитаны по классическим правилам из ведущей и творческой функций. <span data-layer=\"1\"><span class=\"lay l1\">классика</span> Мерность мест и признаки Рейнина.</span></p></div>\n  <div class=\"explorer\">\n    <div class=\"tlist\" id=\"tlist\" role=\"group\" aria-label=\"Тип\"></div>\n    <div class=\"tcard\" id=\"tcard\" aria-live=\"polite\"></div>\n  </div>\n  <div class=\"docs\" style=\"margin-top:16px\"><a class=\"doc\" href=\"docs/polr.html\"><span class=\"kind\">памятка</span><span class=\"dt\">Болевые функции всех типов</span><span class=\"mut\">13 стр.</span></a></div>\n</section><section id=\"reinin\" data-layer=\"1\">\n  <div class=\"kicker\">Классика · признаки Рейнина</div>\n  <h2>Пятнадцать признаков</h2>\n  <div class=\"intro\"><p><span class=\"lay l1\">классика</span> Рейнин математически вывел из четырёх юнговских дихотомий ещё одиннадцать: каждая делит 16 типов пополам, и каждая — комбинация юнговских. Аугустинавичюте описывала их в отдельной работе. Принадлежность типа к полюсу выводится строго; описания смысла у разных авторов расходятся. Поэтому у каждого признака указано, насколько он объясняется самой моделью.</p></div>\n  <div class=\"rnwrap\">\n    <div class=\"rnlist\" id=\"rnlist\" role=\"group\" aria-label=\"Признак\"></div>\n    <div class=\"tcard\" id=\"rncard\" aria-live=\"polite\"></div>\n  </div>\n</section><section id=\"relations\">\n  <div class=\"kicker\">Отношения</div>\n  <h2>Что происходит, когда стыкуются две модели</h2>\n  <div class=\"intro\"><p data-layer=\"0\"><span class=\"lay l0\">ядро</span> Вид отношений следует из того, на какие места модели одного попадают функции другого. По Аугустинавичюте, дуализация повышает самоуважение: тебя ценят за самое естественное в тебе.</p><p data-layer=\"2\"><span class=\"lay l2\">линза</span> Модель описывает удобство обмена восприятием, а не судьбу пары: ценности, возраст и опыт решают не меньше. Разборы ниже написаны с использованием всех слоёв.</p></div>\n  <div class=\"rels-grid\"><div class=\"rel\"><h3>Дуальность</h3><p>Полное дополнение. Четыре канала: восполнение (ведущая → суггестивная), разгон (творческая → активационная), снятие роли (ограничительная → ролевая), прикрытие (демонстративная → болевая).</p><div class=\"docs\"><a class=\"doc\" href=\"docs/don_dyuma.html\"><span class=\"kind\">дуальность</span><span class=\"dt\">Дон Кихот и Дюма</span><span class=\"mut\">15 стр.</span></a><a class=\"doc\" href=\"docs/maxim_gamlet.html\"><span class=\"kind\">дуальность</span><span class=\"dt\">Максим и Гамлет</span><span class=\"mut\">15 стр.</span></a><a class=\"doc\" href=\"docs/napoleon_balzak.html\"><span class=\"kind\">дуальность</span><span class=\"dt\">Наполеон и Бальзак</span><span class=\"mut\">16 стр.</span></a></div></div><div class=\"rel\"><h3>Полудуальность</h3><p>Ведущие совпадают с суггестивными, но творческие не попадают в активационные. Восполнение есть, разгона нет: близко, но с недобором.</p><div class=\"docs\"><a class=\"doc\" href=\"docs/semidual.html\"><span class=\"kind\">полудуальность</span><span class=\"dt\">Дюма и Гексли</span><span class=\"mut\">14 стр.</span></a></div></div><div class=\"rel\"><h3>Ревизия</h3><p>Ведущая ревизора бьёт в болевую подревизного. Даже без умысла один живёт мерками, которые для другого самые уязвимые.</p><div class=\"docs\"><a class=\"doc\" href=\"docs/don_dost.html\"><span class=\"kind\">ревизия</span><span class=\"dt\">Дон Кихот и Достоевский</span><span class=\"mut\">15 стр.</span></a></div></div><div class=\"rel\"><h3>Активация</h3><p>Та же квадра, другая рациональность. Подзарядка через активационную, восполнение порциями; бодрит, но в больших дозах перегревает.</p><div class=\"docs\"><a class=\"doc\" href=\"docs/don_gugo.html\"><span class=\"kind\">активация</span><span class=\"dt\">Дон Кихот и Гюго</span><span class=\"mut\">15 стр.</span></a></div></div></div>\n</section><section id=\"beyond\" data-layer=\"3\">\n  <div class=\"kicker\">Вне типа</div>\n  <h2>Тип — рельеф, а не маршрут</h2>\n  <div class=\"intro\"><p><span class=\"lay l3\">гипотеза</span> Тип задаёт цену: какую информацию психике обрабатывать легко, а какую дорого, что ценно, где уязвимо. Куда человек идёт, решают ценности, опыт, возраст, среда; осознанность — это знание карты. Чем меньше ресурса и внешних подсказок, тем сильнее проступает тип. Главная ловушка: если любое несовпадение объяснять слоями, тип станет неопровержимым.</p></div>\n  <div class=\"docs\"><a class=\"doc\" href=\"docs/don_dum_layers.html\"><span class=\"kind\">слои</span><span class=\"dt\">Дон Кихот и Дюма: тип и всё остальное</span><span class=\"mut\">26 стр.</span></a></div>\n</section><section id=\"rules\" data-layer=\"2\">\n  <span class=\"lay l2\">линза</span><div class=\"kicker\">Принципы серии</div>\n  <h2>Как здесь пишется о функциях</h2>\n  <div class=\"rules\">\n    <div><h4>Сначала просто, потом глубже</h4><p>Каждая функция: простая фраза, затем «Глубже, по параметрам» — опыт, нормы, ситуация, время, построчно.</p></div>\n    <div><h4>Объекты широко</h4><p>Вещи, пространство, звук, тело, идеи, процессы, дела. Люди — только один из объектов.</p></div>\n    <div><h4>Слабое так же подробно, как сильное</h4><p>Болевые и суггестивные описываются через то, чего именно не видно и что из этого следует.</p></div>\n    <div><h4>Термины остаются</h4><p>Термин, аббревиатура и короткий ярлык рядом: «Белая сенсорика · БС · самочувствие».</p></div>\n    <div><h4>Каждый разбор самостоятелен</h4><p>Документы не сравнивают пары между собой: каждый читается сам по себе.</p></div>\n    <div><h4>Вне соционики</h4><p>Каждый разбор заканчивается пределами модели и тем, что известно из проверяемой психологии.</p></div>\n  </div>\n  <p class=\"src\" style=\"margin-top:24px\"><b>Источники серии:</b> Аугустинавичюте А. «Дуальная природа человека», «Модель А», «Социон»; Букалов А. В. о размерности функций; «Интертипные отношения» (Академик / Википедия); Schwartz S. H., 2012; Roberts B. W. и др., 2006; Mischel W., Shoda Y., 1995; Montoya R. M. и др., 2008; From A. и др., 2025; Crocker J., Wolfe C. T., 2001; Hofstede G.; Inglehart R., Welzel C.</p>\n</section>";
function basicsPage(){ return `<div class="hero"><div><div class="kicker">Соционика · основа</div><h1>Основы</h1><div class="lead">Из чего всё строится: аспекты, модель А, мерность, квадры, признаки Рейнина — и как здесь устроены слои.</div></div></div><div class="basics">${BASICS}</div>`; }
// ---------- страница: тип и всё остальное (слои)
const AREA = {Ne:'исследования, стартапы, изобретательство',Ti:'инженерия, аналитика, право',Se:'спорт, переговоры, руководство',Fi:'психология, педагогика, забота о людях',Si:'кулинария, дизайн среды, телесные практики',Fe:'сцена, ведение событий, команда',Ni:'планирование, стратегия, история',Te:'учёт, технологии, управление процессом'};
const EXPG = {0:'Рост естественный: опыт ложится на ведущую и становится мировоззрением.',1:'Творческая: опыт делает инструмент виртуозным.',2:'Ролевая: научается по правилам; выглядит уверенно, но выматывает.',3:'Болевая: может стать профи на правилах и чек-листах, но каждый день стоит дорого, ошибки ранят.',4:'Суггестивная: держится на внешних системах и людях, сам сбивается.'};
function rawRows(t, a, pain){
  const r = t.raw[a] || {};
  return ['Опыт','Нормы','Ситуация','Время'].map((P, p) => {
    const txt = r[P] ?? r[P+'-'], miss = !(P in r);
    if (pain && p === 0) return `<div class="pr"><b>Опыт:</b><span>много — но это всё ещё только своё: ${(txt||'').replace(/^только своё[:—\s]*/,'')}</span></div>`;
    if (pain && p === 1) return `<div class="pr"><b>Нормы:</b><span><i>выучены снаружи</i> — правила и методики как инструкция, а не чутьё.</span></div>`;
    return `<div class="pr${miss ? ' no' : ''}"><b>${P}:</b><span>${miss ? '<i>нет</i> — ' : ''}${txt || ''}</span></div>`; }).join('');
}
function layersPage(k){
  k = k && T[k] ? k : 'SEI';
  const t = T[k], m = t.m, nm = t.name, g = G(t), ab = a => `${D.ab[a]} «${D.tag[a]}»`;
  const pick = D.order.map(c => `<a class="chip${c === k ? ' on' : ''}" href="#layers-${c.toLowerCase()}" style="${c === k ? `border-color:var(--${T[c].m[0]});font-weight:700` : ''}">${T[c].name}</a>`).join(' ');
  const cl = [['«Тип определяет характер, поступки и судьбу».','Тип описывает, какую информацию психике обрабатывать легко, а какую дорого, и что для неё ценно. Что человек с этим сделает, решают опыт, ценности, среда, воля.'],
    [`«Если ${nm} делает то, что ему трудно, значит он не ${nm}».`,'Навык можно нарастить почти в любой области. Тип выдаёт не умение, а цену: что после такого дня выматывает и что восстанавливает.'],
    ['«С возрастом тип меняется».','В модели Аугустинавичюте тип постоянен. С возрастом меняется отношение к своим функциям и количество опыта в них.'],
    ['«Не похож на описание — значит, другой тип».','Описания рисуют «чистый» тип без опыта, ценностей и среды. Таких людей почти нет.']];
  const weight = [['Стресс, усталость, болезнь','высокий','силы на маски кончаются, остаётся самое дешёвое'],['Свободное время, отдых','высокий','никто не требует роли — психика выбирает свой рельеф'],['Близкие отношения','высокий','роль снимают, и там, где у тебя слабо, нужна чужая сила'],['Новая задача без образца','высокий','опыта нет, работает голая оптика типа'],['Публичная роль, первое знакомство','низкий','включаются ролевая функция и выученные нормы'],['Рутинная работа с большим стажем','низкий','навык и привычка закрывают разницу между типами'],['Жёсткие правила среды: армия, конвейер, протокол','низкий','поведение задаёт инструкция, тип виден по усталости']];
  const lv = [['1 · На автомате','Не знает своих особенностей и принимает их за устройство мира.',`Уверен, что все смотрят на мир через ${ab(m[0])} так же, как он. Где нужна болевая ${D.ab[m[3]]}, — сюрпризы: ${t.polr.short}. Без поддержки по суггестивной ${D.ab[m[4]]} сбивается и не понимает почему.`],
    ['2 · Замечает','Видит свои слабые и сильные места, но ещё не всегда успевает ими управлять.',`Знает свою болевую ${D.ab[m[3]]} и не стыдится её. Просит помочь там, где нужна ${ab(m[4])}, и ставит себе «упоры» от других людей.`],
    ['3 · Управляет','Выбирает, куда направить сильное, и строит обходы для слабого.',`Сознательно выбирает, где применять творческую ${ab(m[1])}. Для болевой ${D.ab[m[3]]} берёт готовые правила и методики вместо того, чтобы изобретать своё. Заранее встраивает в жизнь то, что даёт ${D.ab[m[4]]}.`]];
  const exp = [0,1,2,3,4].map(i => `<tr><td>${AREA[m[i]]}</td><td style="color:var(--${m[i]})">${D.syms[m[i]]} ${ab(m[i])}<div class="sm mut">${D.posn[i].toLowerCase()} · ${D.dim[i]}D</div></td><td>${EXPG[i]}</td></tr>`).join('');
  const age = [['Детство','ведущая сырая, суггестивная — зона полной зависимости от взрослых',`Уже живёт ведущей ${ab(m[0])}, но без опыта и норм. Там, где нужна ${D.ab[m[4]]}, полностью зависит от взрослых.`],
    ['Юность · 15–25','ролевая — маска, болевая — источник стыда',`Изображает ${D.ab[m[2]]} «${D.tag[m[2]]}» по образцам — спорит, доказывает, держит лицо. Стыдится всего, что требует болевой ${D.ab[m[3]]}; упрёки по этой линии ранят сильнее всего.`],
    ['Становление · 25–40','творческая становится профессией',`Творческая ${ab(m[1])} становится ремеслом: ${AREA[m[1]]}.`],
    ['Зрелость · 40+','роль ослабевает, болевая принимается, ценности весомее типа',`Меньше изображает ${D.ab[m[2]]}, спокойнее делегирует то, что требует ${D.ab[m[3]]}. Ценит то, что делает легко, и не извиняется за свой ритм.`]];
  const V = D.vars && D.vars[k];
  const CR = {3:5,2:4,4:4,5:3,6:2,7:2,1:1,0:1};
  const vrows = V ? V.map((v,n) => { const i = m.indexOf(v.ka), c = CR[i]; return `<tr><td><a href="#type-${k.toLowerCase()}-v${n}"><b>${v.n}</b></a></td><td>${v.val}</td><td style="color:var(--${v.ka})">${D.syms[v.ka]} ${D.ab[v.ka]}<div class="sm mut">${D.posn[i].toLowerCase()}</div></td><td><span class="cost">${'●'.repeat(c)}<span class="mut">${'○'.repeat(5-c)}</span></span></td></tr>`; }).join('') : '';
  return `<div class="crumb"><a href="#home">Типы</a> / Тип и всё остальное</div>
  <div class="hero"><div><div class="kicker">Соционика · линза</div><h1>Тип и всё остальное</h1>
    <div style="font-family:var(--serif);font-size:20px">осознанность, опыт, возраст, ценности, среда</div>
    <p>Почему два человека одного типа могут быть не похожи, когда тип виден ярко, а когда почти исчезает.</p>
    <p class="sm mut">${lay(2)}Модель слоёв, «вес типа» и варианты — моя линза, а не часть исходной теории.</p></div></div>
  <div class="sheet"><div class="kicker">Выбери тип — примеры на странице подстроятся под него</div><div class="chips">${pick}</div></div>
  <div class="sheet"><div class="kicker">Что имела в виду Аугустинавичюте</div><h2>Тип — это обмен информацией, а не содержание жизни</h2>
    <p>${lay(0)}Тип она называла типом информационного метаболизма: каким способом психика принимает и перерабатывает сигналы мира. Тип, по её мысли, врождённый и с годами не меняется. Чем человек занят, во что верит, чего добился — это уже не тип.</p>
    <p>${lay(1)}Подтипы, акцентуации и «уровни» появились после неё: у Гуленко, Букалова, Таланова и других.</p>
    <div class="tw"><table class="ptab"><tr><th>Клише</th><th>Что на самом деле</th></tr>${cl.map(([a,b]) => `<tr><td class="mut"><s>${a}</s></td><td>${b}</td></tr>`).join('')}</table></div></div>
  <div class="sheet"><div class="kicker">Линза</div><h2>Тип — рельеф, а не маршрут</h2>
    <p>${lay(2)}Представь местность. Тип задаёт рельеф: где идти легко, где каждый шаг в гору, где тянет остановиться. Но куда человек идёт, решает не рельеф. Маршрут выбирают ценности, дорогу прокладывает опыт, погоду делают среда и состояние, а осознанность — это знание карты. Двое на одном рельефе могут прийти в совсем разные места; общей у них будет только цена пути.</p>
    <div class="layring">${['состояние','среда и роль','возраст','ценности','опыт и навыки','тип'].map((x,i) => `<div style="--i:${i}"><span>${x}</span></div>`).join('')}</div>
    <div class="vgrid"><div class="vc"><div class="kicker">Что задаёт тип</div><p>Какую информацию психика обрабатывает дёшево, а какую дорого. Что ценно и чего не хватает. Где уязвимо. Что восстанавливает, а что выматывает.</p></div>
      <div class="vc"><div class="kicker">Что тип не задаёт</div><p>Профессию, умения, мораль, цели, вкусы, интересы, успех, уровень зрелости. Всё это растёт из опыта, ценностей, среды и решений человека.</p></div></div>
    <p class="sm" style="margin-top:10px">${lay(0)}${nm} — ${t.rat ? 'рационал: первой стоит оценивающая' : 'иррационал: первой стоит воспринимающая'} ${ab(m[0])}. ${t.rat ? 'Сначала суждение, потом восприятие; решения держатся.' : 'Сначала восприятие, потом оценка; решения пересматриваются, когда меняется картина.'} ${lay(2)}Но профессия может сделать человека внешне ${t.rat ? '«иррациональным»: гибкость становится навыком' : '«рациональным»: дисциплина становится навыком'}. Признак, что это навык, а не тип: в отпуске и в свободный день прежний ритм возвращается сам.</p></div>
  <div class="sheet"><div class="kicker">Вес типа</div><h2>Когда тип видно ярко, а когда он почти исчезает</h2>
    <p>${lay(2)}Вес типа — условная мера: насколько поведение в данной ситуации объясняется типом, а не навыком, ролью, правилами или ценностями. Чем меньше у психики ресурса и внешних подсказок, тем сильнее проступает рельеф.</p>
    <div class="tw"><table class="ptab"><tr><th>Ситуация</th><th>Вес типа</th><th>Почему</th></tr>${weight.map(([a,b,c]) => `<tr><td>${a}</td><td><b style="color:var(${b === 'высокий' ? '--hard' : '--good'})">${b}</b></td><td>${c}</td></tr>`).join('')}</table></div>
    <div class="vc" style="margin-top:10px;border-left:4px solid var(--${m[0]})"><div class="kicker">${nm} при высоком весе ${lay(2)}</div><p>Уходит в ${ab(m[0])}: ${VLIFE[m[0]][0].replace(/^Живёт /,'живёт ').replace(/^Пользуется/,'пользуется')} Всё, что требует болевой ${D.ab[m[3]]}, проваливается: ${t.polr.short}. Не хватает того, кто даст ${ab(m[4])}.</p></div>

const S8 = i => STRONG[i] === 1, V8 = i => VALUED[i] === 1;
function chan(i, j, A, B){
  const give = (X, xi, Y, yj) => {
    if (yj === 4) return ['восполнение','--good', `${X} → ${Y}: то, что для одного естественно, другой жаждет и принимает почти без проверки${xi>=6?'. Но отдаёт это фоном, сам того не замечая':''}.`];
    if (yj === 5) return ['разгон','--good', `${X} → ${Y}: помощь бодрит и подталкивает к действию${xi>=6?', но приходит нерегулярно, фоном':''}.`];
    if (yj === 2) return xi < 2 ? ['давление на роль','--mid', `${X} этим живёт и невольно держит планку; ${Y} здесь держит лицо через усилие и устаёт.`] : ['снятие роли','--good', `${X} умеет и ничего не требует: ${Y} может не играть роль.`];
    if (yj === 3) return xi < 2 ? ['удар в болевую','--hard', `${X} этим живёт; ${Y} здесь уязвимее всего — задевает даже без умысла.`] : ['прикрытие','--good', `${X} силён здесь, но не ценит этого; ${Y} здесь уязвим, а оценки не будет — только тихая работа за двоих.`];
  };
  if (S8(i) && S8(j)) {
    if (V8(i) && V8(j)) return ['общая сила','--soft','Оба сильны и оба ценят: понимают друг друга без слов, но дополнить друг друга нечем.'];
    if (V8(i) !== V8(j)) { const [X,Y] = V8(i) ? [A,B] : [B,A]; return ['сила без отклика','--mid', `Оба сильны, но ${X} этим живёт, а ${Y} умеет и не придаёт значения.`]; }
    return ['мимо друг друга','--mid','Оба сильны и оба не ценят: тема между ними почти не возникает.'];
  }
  if (S8(i)) return give(A, i, B, j);
  if (S8(j)) return give(B, j, A, i);
  if (V8(i) && V8(j)) return ['общий голод','--mid','Оба ценят и оба слабы: голод общий, а утолить его некому.'];
  return ['слабое на слабом','--mid','Здесь оба слабы: опоры друг другу не дадут, но и сильно не заденут.'];
}
function linksSvg(A, B, nameA, nameB){
  const xs = [0,1,2,3,4,5,6,7].map(i => 118 + i*56), yA = 52, yB = 222;
  let o = `<svg viewBox="0 0 580 260" role="img" aria-label="Как места одного типа соединены с местами другого">`;
  for (let i = 0; i < 8; i++) o += `<text x="${xs[i]}" y="16" text-anchor="middle" font-size="8" fill="var(--mut)">${i+1}</text><text x="${xs[i]}" y="252" text-anchor="middle" font-size="8" fill="var(--mut)">${i+1}</text>`;
  o += `<text x="8" y="56" font-size="11" font-weight="700" fill="var(--fg)">${nameA}</text><text x="8" y="226" font-size="11" font-weight="700" fill="var(--fg)">${nameB}</text>`;
  A.m.forEach((a,i) => { const j = B.m.indexOf(a); const c = chan(i, j, '', '')[1]; o += `<line x1="${xs[i]}" y1="${yA+15}" x2="${xs[j]}" y2="${yB-15}" stroke="var(${c})" stroke-width="2"/>`; });
  A.m.forEach((a,i) => { o += `<g transform="translate(${xs[i]-11},${yA-11}) scale(1.22)">${D.syms[a]}</g>`; });
  B.m.forEach((a,i) => { o += `<g transform="translate(${xs[i]-11},${yB-11}) scale(1.22)">${D.syms[a]}</g>`; });

const pdesc = (r, k) => r.codes.includes(k) ? r.pd : r.md;
function pairMeaning(r, k1, k2){

}

    drag(g, e => { moved = true; o.held = true; const p = svgPt(svg, e); o.x = p.x; o.y = p.y; }, () => { o.held = false;
      if (!moved) cycle();

}
const NF = {'Дон Кихот':['Дон Кихота','Дон Кихоту'],'Дюма':['Дюма','Дюма'],'Гюго':['Гюго','Гюго'],'Робеспьер':['Робеспьера','Робеспьеру'],'Гамлет':['Гамлета','Гамлету'],'Максим':['Максима','Максиму'],'Жуков':['Жукова','Жукову'],'Есенин':['Есенина','Есенину'],'Наполеон':['Наполеона','Наполеону'],'Бальзак':['Бальзака','Бальзаку'],'Джек Лондон':['Джека Лондона','Джеку Лондону'],'Драйзер':['Драйзера','Драйзеру'],'Штирлиц':['Штирлица','Штирлицу'],'Достоевский':['Достоевского','Достоевскому'],'Гексли':['Гексли','Гексли'],'Габен':['Габена','Габену']};
const G = t => NF[t.name][0], Dt = t => NF[t.name][1];
const lf = s => s ? s[0].toLowerCase() + s.slice(1) : '';
const ROLEW = {2:'держит лицо по правилам, через усилие', 3:'уязвим больше всего', 4:'жаждет этого и ждёт извне', 5:'хочет этому учиться'};
function explain(x, kA, kB){
  const A = T[kA], B = T[kB], i = A.m.indexOf(x), j = B.m.indexOf(x), tag = `«${D.tag[x]}»`, ab = D.ab[x];
  const sA = STRONG[i], sB = STRONG[j], vA = VALUED[i], vB = VALUED[j];
  let label, tone, plain;
  const give = (X, xi, Y, yj) => {
    const xv = VALUED[xi];
    if (yj === 4) return ['восполнение','--good', `То, что ${X.name} видит в ${ab} ${tag} без усилия${xv ? ' и с удовольствием' : ''}, — именно то, чего ${Dt(Y)} больше всего не хватает. Сам он этого не производит, а когда получает, узнаёт мгновенно и принимает почти без проверки. ${xv ? `Для ${G(X)} это ничего не стоит, для ${G(Y)} — облегчение. Это один из главных источников лёгкости в паре.` : `Но для ${G(X)} это не важно: он даёт это фоном, нерегулярно и может перестать, даже не заметив, что лишил партнёра нужного.`}`];
    if (yj === 5) return ['разгон','--good', `${X.name} ${xv ? 'свободно и охотно' : 'между делом'} делает то, что у ${G(Y)} — слабое, но ценное место. Сам ${Y.name} здесь не силён, но очень хочет научиться, и помощь его бодрит: рядом с партнёром он становится активнее и смелее.${xv ? '' : ' Только приходит она нерегулярно: для партнёра это фон.'}`];
    if (yj === 2) return xv ? ['давление на роль','--mid', `Для ${G(X)} ${ab} ${tag} — важная и естественная часть жизни, он невольно держит здесь свою планку. Для ${G(Y)} это роль: он умеет «как положено», по правилам, через усилие. Рядом с партнёром приходится соответствовать, и это утомляет, хотя и не ранит.`] : ['снятие роли','--good', `${X.name} здесь силён, но не придаёт этому значения и ничего не требует. ${Y.name} обычно держит здесь лицо через усилие, а рядом с партнёром может перестать: тот сделает это фоном и не станет оценивать.`];
    if (yj === 3) return xv ? ['удар в болевую','--hard', `${X.name} живёт ${ab} ${tag}: оценивает мир через это и действует так естественно, что сам не замечает. Для ${G(Y)} это самое уязвимое место: здесь у него только личный опыт, без норм и без чувства ситуации. Даже без умысла естественное поведение партнёра звучит для него как критика или требование.`] : ['прикрытие','--good', `${X.name} здесь силён, но не ценит этого, поэтому ничего не оценивает и не требует. Там, где ${Y.name} уязвим больше всего, партнёр просто делает за двоих — тихо, без замечаний. Уязвимость не исчезает, но её не трогают.`];
  };
  if (sA && sB) {
    if (vA && vB) [label, tone, plain] = ['общая сила','--soft', `Оба хорошо видят ${ab} ${tag} и оба считают это важным. Здесь легко понимать друг друга без слов: оба замечают одно и то же и оба хотят об этом говорить. Но дополнить друг друга нечем: если оба ошибутся, поправить некому, а в споре о деталях каждый уверен в своём.`];
    else if (vA !== vB) { const [X, Y] = vA ? [A, B] : [B, A]; [label, tone, plain] = ['сила без отклика','--mid', `Оба хорошо видят ${ab} ${tag}, но относятся к этому по-разному. Для ${G(X)} это главное или любимое: он хочет, чтобы это замечали и разделяли. Для ${G(Y)} это фон: он делает это на автомате и не понимает, о чём тут говорить. Поэтому ${X.name} может делиться и не получать отклика, а ${Y.name} — не понимать, чего от него ждут. Ссоры здесь обычно нет, но нет и общей радости.`]; }
    else [label, tone, plain] = ['мимо друг друга','--mid', `Оба умеют это и оба не придают значения. Тема ${ab} ${tag} между ними почти не возникает: каждый делает фоном своё, и это никого не беспокоит.`];
  }
  else if (sA) [label, tone, plain] = give(A, i, B, j);
  else if (sB) [label, tone, plain] = give(B, j, A, i);
  else {
    const both = `Здесь оба слабы, но по-разному: ${A.name} ${ROLEW[i]}, ${B.name} ${ROLEW[j]}. `;
    const k = [i, j].sort().join('');
    const out = {'45':'Оба ценят это и ждут, что даст другой, а дать некому. Голод общий: пара будет искать это вовне — в друзьях, местах, занятиях.',
      '44':'Оба ждут этого извне. Голод общий, утолить его некому: нужен третий.', '55':'Оба хотят учиться, но учить некому. Вместе могут осваивать это по книгам и чужим образцам.',
      '24':'Тот, кто держит лицо, может пытаться помочь «по учебнику». Помощь будет, но формальная и через силу: голод утолится наполовину.',
      '25':'Тот, кто держит лицо, может учить по образцу, а второй охотно будет учиться. Но учитель сам здесь через силу и быстро устаёт.',
      '34':'Один здесь уязвим, другой ждёт помощи. Оба ждут, а тема болезненна: лучше, когда это закрывает кто-то третий.',
      '35':'Один здесь уязвим, другой хочет учиться. Вопросы второго могут задевать первого, хотя задеть он не хочет.',
      '23':'Оба слабы и оба не ценят это. Хорошо, что никто не требует; плохо, что, если это понадобится — в деле, быту, кризисе, — опереться будет не на кого.',
      '22':'Оба держат лицо по правилам. Понимают друг друга в этой роли, но и устают оба.', '33':'Оба уязвимы в одном и том же. Могут беречь друг друга, но и задеть одно и то же место может любой посторонний.'}[k] || 'Опереться друг на друга здесь не получится.';
    [label, tone, plain] = [vA && vB ? 'общий голод' : 'слабое на слабом', '--mid', both + out];
  }
  const sa = A.lens[x] ? A.lens[x][0] : '', sb = B.lens[x] ? B.lens[x][0] : '';
  if (sa && sb) plain += ` <span class="look"><b>Как это выглядит.</b> ${A.name}: ${lf(sa)} ${B.name}: ${lf(sb)}</span>`;
  const why = `<div class="ex-why"><div><b>${A.name}:</b> ${D.posn[i].toLowerCase()} · ${D.dim[i]}D · ${STRONG[i]?'сильная':'слабая'}, ${VALUED[i]?'ценная':'не ценная'}. <span class="mut">Учитывает ${PARW[D.dim[i]-1]}.</span> ${keyRow(A, x)}</div><div><b>${B.name}:</b> ${D.posn[j].toLowerCase()} · ${D.dim[j]}D · ${STRONG[j]?'сильная':'слабая'}, ${VALUED[j]?'ценная':'не ценная'}. <span class="mut">Учитывает ${PARW[D.dim[j]-1]}.</span> ${keyRow(B, x)}</div></div>`;
  return {label, tone, plain, why, i, j};
}
function storySheet(kA, kB){
  const A = T[kA], B = T[kB];
  const ex = A.m.map(x => Object.assign({x}, explain(x, kA, kB)));
  const grp = {good: ex.filter(e => e.tone === '--good'), hard: ex.filter(e => e.tone === '--hard'), mid: ex.filter(e => e.tone === '--mid' || e.tone === '--soft')};
  const item = e => `<details class="exi" style="--c:var(--${e.x})"><summary><span class="ab" style="color:var(--${e.x})">${D.syms[e.x]}${D.ab[e.x]}</span><span class="ctag" style="background:var(${e.tone})">${e.label}</span><span class="pl">${e.plain}</span></summary><div data-layer="2" class="sm"><b>Почему так.</b>${e.why}</div></details>`;
  const verdict = grp.good.length >= 6 ? 'Модели почти полностью дополняют друг друга: почти везде, где один слаб, другой силён и даёт это без усилия.' : grp.hard.length >= 2 ? 'В паре есть места, где один невольно задевает самое уязвимое у другого. Лёгкость возможна, но требует знания этих мест.' : grp.good.length >= 3 ? 'Дополнение частичное: в одних аспектах пара помогает друг другу, в других оба одинаково сильны или одинаково слабы.' : 'Дополнения мало: пара скорее похожа или живёт параллельно, чем закрывает слабые места друг друга.';
  return `<div class="sheet"><div class="kicker">Как они взаимодействуют</div><h2>${A.name} и ${B.name}: суть</h2>
    <p class="lead" style="max-width:none">${verdict}</p>
    <p class="sm">${lay(2)}Ниже — по каждому аспекту: что выходит между ними простыми словами. Нажми на строку — откроется «почему так»: где функция стоит у каждого, сколько параметров учитывает и как это выглядит по разборам.</p>
    ${grp.good.length ? `<h3 class="exh" style="color:var(--good)">Где легко · ${grp.good.length}</h3>${grp.good.map(item).join('')}` : ''}
    ${grp.hard.length ? `<h3 class="exh" style="color:var(--hard)">Где задевает · ${grp.hard.length}</h3>${grp.hard.map(item).join('')}` : ''}
    ${grp.mid.length ? `<h3 class="exh" style="color:var(--mut)">Где ровно, холодно или пусто · ${grp.mid.length}</h3>${grp.mid.map(item).join('')}` : ''}</div>`;
}

function bindPick(){
  const go = document.getElementById('go'); if (!go) return;
  go.addEventListener('click', () => { const a = document.getElementById('pa').value, b = document.getElementById('pb').value; location.hash = `pair-${a.toLowerCase()}-${b.toLowerCase()}`; });
}
function bindMatrix(){
  app.querySelectorAll('table.mx td').forEach(td => {
    const go = () => location.hash = `pair-${td.dataset.a.toLowerCase()}-${td.dataset.b.toLowerCase()}`;
    td.addEventListener('click', go); td.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  });
}
function route(){
  const h = location.hash.slice(1);
  let html, nav = 'home', m;
  let openV = null, openAnchor = null;
  if ((m = h.match(/^type-([a-z]{3})(?:-v(\d))?$/)) && T[m[1].toUpperCase()]) { html = typePage(m[1].toUpperCase()); openV = m[2]; }
  else if ((m = h.match(/^pair-([a-z]{3})-([a-z]{3})$/)) && T[m[1].toUpperCase()] && T[m[2].toUpperCase()]) { cur.a = m[1].toUpperCase(); cur.b = m[2].toUpperCase(); html = pairPage(cur.a, cur.b); nav = 'rel'; }
  else if (h === 'functions') { html = aspectsIndex(); nav = 'fn'; }
  else if ((m = h.match(/^aspect-([a-z]{2})$/)) && AORD.includes(m[1][0].toUpperCase()+m[1][1])) { html = aspectPage(m[1][0].toUpperCase()+m[1][1]); nav = 'fn'; }
  else if ((m = h.match(/^cmp-([a-z]{2})-([a-z]{3})-([a-z]{3})$/)) && AORD.includes(m[1][0].toUpperCase()+m[1][1]) && T[m[2].toUpperCase()] && T[m[3].toUpperCase()]) { html = cmpPage(m[1][0].toUpperCase()+m[1][1], m[2].toUpperCase(), m[3].toUpperCase()); nav = 'fn'; }
  else if ((m = h.match(/^layers(?:-([a-z]{3}))?$/))) { html = layersPage(m[1] ? m[1].toUpperCase() : null); nav = 'home'; }
  else if ((m = h.match(/^paths(?:-([a-z]{3}))?$/))) { html = pathsPage(m[1] ? m[1].toUpperCase() : null); nav = 'home'; }
  else if (h === 'basics') { html = basicsPage(); nav = 'bas'; }
  else if (h === 'quadras') { html = quadrasPage(); nav = 'quad'; }
  else if (h === 'polr' || /^polr-[a-z]{2}$/.test(h)) { html = polrPage(); nav = 'fn'; if (h !== 'polr') openAnchor = h; }
  else if (h === 'relations') { html = relationsPage(); nav = 'rel'; }
  else if ((m = h.match(/^rel-([a-z-]+)$/)) && D.rel[m[1].replace('-','_')]) { html = relKindPage(m[1].replace('-','_')); nav = 'rel'; }
  else if (/^(fn|pos)-\d$/.test(h)) { const el = document.getElementById(h); if (el) { el.scrollIntoView(); return; } html = home(); }
  else { html = home(); }
  clearToys(); hideTip && hideTip();
  app.innerHTML = html + `<footer>Авторская интерпретация, 2026. Ядро — по Аугустинавичюте; классика — Букалов, Рейнин; линза и гипотезы — мои. Соционика не прошла строгой научной проверки.</footer>`;
  document.getElementById('nav-home').toggleAttribute('aria-current', nav === 'home'); if (nav==='home') document.getElementById('nav-home').setAttribute('aria-current','page');
  ['home','fn','rel','quad','bas'].forEach(n => { const el = document.getElementById('nav-'+n); el.removeAttribute('aria-current'); if (nav === n) el.setAttribute('aria-current','page'); });
  bindPick(); bindMatrix(); bindCmp(); if (nav === 'fn') { const mm = h.match(/^aspect-([a-z]{2})$/); if (mm) { const A = mm[1][0].toUpperCase()+mm[1][1]; bindStage(A); mountToy(A); } mountBW(); } window.scrollTo(0, 0);
  if (openAnchor) { const el = document.getElementById(openAnchor); if (el) el.scrollIntoView({block:'start'}); }
  if (openV != null) { const b = document.querySelector(`#vals .vtab[data-v="${openV}"]`); if (b) { b.click(); openTo(document.getElementById('vals')); } }
}
const openTo = el => { el.querySelectorAll(':scope > details.fold').forEach(d => d.open = true); let p = el; while (p) { if (p.tagName === 'DETAILS') p.open = true; p = p.parentElement; } el.scrollIntoView({block:'start'}); };
app.addEventListener('click', e => { const a = e.target.closest('a[href^="#fn-"],a[href^="#pos-"]'); if (a) { e.preventDefault(); const el = document.getElementById(a.getAttribute('href').slice(1)); if (el) openTo(el); } });

const tipEl = document.getElementById('tip');
let tipFor = null;
function showTip(b){
  tipFor = b; tipEl.textContent = b.dataset.tip; tipEl.hidden = false;
  const r = b.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let x = Math.min(Math.max(16, r.left), window.innerWidth - w - 16);
  let y = r.bottom + 8; if (y + h > window.innerHeight - 8) y = r.top - h - 8;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
  b.setAttribute('aria-describedby', 'tip');
}
function hideTip(){ if (tipFor) tipFor.removeAttribute('aria-describedby'); tipFor = null; tipEl.hidden = true; }
app.addEventListener('mouseover', e => { const b = e.target.closest('.tipb'); if (b) showTip(b); });
app.addEventListener('mouseout', e => { const b = e.target.closest('.tipb'); if (b && !b.contains(e.relatedTarget)) hideTip(); });
app.addEventListener('focusin', e => { const b = e.target.closest('.tipb'); if (b) showTip(b); });
app.addEventListener('focusout', e => { if (e.target.closest('.tipb')) hideTip(); });
app.addEventListener('click', e => { const b = e.target.closest('.tipb'); if (b) { if (tipFor === b) hideTip(); else showTip(b); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
window.addEventListener('scroll', hideTip, {passive:true});
window.addEventListener('hashchange', route);
route();
</script>
