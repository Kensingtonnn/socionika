т, как будет нарастать и спадать заряд — вечера, проекта, сезона — и ведёт его к пику.", "итог": "Через эту оптику он смотрит на мир: живо то, что горит."}, "Ne": {"Опыт": "помнит, какие неожиданные ходы срабатывали.", "Нормы": "охотно перенимает чужие варианты и идеи.", "Ситуация-": "сам не видит запаса конкретного: другого применения вещи, обходного пути.", "Время-": "не разворачивает ветки «если — то».", "итог": "Новый ход от другого бодрит: подъёму есть куда двигаться."}, "Si": {"Опыт": "помнит, что сочеталось и хорошо ощущалось: вкус, свет, ткань, звук, ритм.", "Нормы": "знает, как устроено приятное: освещение, фактура, температура, удобная форма, сочетание вкусов.", "Ситуация": "собирает конкретное «здесь» так, чтобы ощущение усиливало подъём: поменяет свет, добавит музыку, переставит стол.", "Время-": "самочувствие надолго не выстраивает: настраивает под момент и под событие."}}, "port": ["Как душа праздника, который ещё и художник по свету: чувствует, где людям не хватает подъёма, зажигает их — а цвет, вкус и пространство подхватывают этот подъём.", ["Чувствует, где горит, а где гаснет — в человеке, компании, событии, деле, тексте, месте, — и поднимает накал. Живо для него то, что горит.", "Собирает свет, звук, вкус, фактуры и ритм так, чтобы людям было хорошо, а ощущение усиливало подъём.", "Меры. В подъёме теряются пропорции: что важно, что второстепенно, что чему противоречит. Ясная система приносит облегчение.", "Вопрос «к чему это всё идёт?» и мрачные прогнозы. Процесс видится как череда ярких моментов, а линия между ними — нет."], "там, где нужно зажечь людей и сделать ощутимым: события, компании, сцена, гастрономия, оформление, запуск проектов."], "polr": {"how": "Живёт накалом момента; когда он гаснет, линии между событиями нет. Не видит, на какой стадии дело, отношения, вещь, сезон; ожидание без ясного конца тяжело.", "hurt": "«а к чему всё это?», мрачный прогноз, «рано радуешься», бесконечное «посмотрим».", "defend": "заполняет паузу делами и ощущениями (БС), поднимает настроение, переключает тему.", "where": "затянувшийся ремонт, долгое лечение, проект без видимого конца, пауза после праздника: тревожно, когда «ничего не происходит».", "why": "Гюго теряет линию, когда гаснет накал; Штирлиц — когда кончается план. Пустоту будущего первый заполняет подъёмом, второй — делом.", "short": "гаснет накал — пропадает линия"}, "rel": {"ILE": "act", "SEI": "mirror", "ESE": "id", "LII": "dual", "EIE": "quasi", "LSI": "semi", "SLE": "ben_by", "IEI": "rev_by", "SEE": "kin", "ILI": "conf", "LIE": "super", "ESI": "ext", "LSE": "business", "EII": "mirage", "IEE": "ben_of", "SLI": "rev_of"}}, "LII": {"name": "Робеспьер", "ru": "ЛИИ", "m": ["Ti", "Ne", "Fi", "Se", "Fe", "Si", "Te", "Ni"], "q": "Альфа", "rat": true, "dual": "ESE", "traits": ["интроверты", "интуиты", "логики", "рационалы", "статики", "демократы", "весёлые", "рассудительные", "предусмотрительные", "упрямые", "квестимы", "негативисты", "стратеги", "эмотивисты", "результаторы"], "lens": {"Ti": ["Видит в любом предмете конструкцию: что чему соответствует, к какому классу относится, где противоречие, — в теории, механизме, законе, тексте, в рассуждениях людей.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, какие построения выдерживали проверку, а какие разваливались: доказательство, где одна посылка тянула за собой всё остальное, договор с дырой в формулировке, схема, которая противоречила сама себе.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает правила построения: определение, классификация, доказательство, иерархия понятий. Видит, где нарушен порядок рассуждения, ещё до того, как может это объяснить.</span></div><div class=\"pr\"><b>Ситуация:</b><span>соизмеряет именно этот предмет: в этой таблице одна колонка лишняя, в этом тексте термин меняет смысл на третьей странице, в этом механизме деталь выпадает из ряда остальных.</span></div><div class=\"pr\"><b>Время:</b><span>видит, к чему правило приведёт через годы: где закон начнёт противоречить сам себе, где классификация треснет, когда появятся новые случаи, где система обречена разрастись в хаос.</span></div><div class=\"it\">Через эту оптику он смотрит на мир: верно то, что непротиворечиво. Поэтому хорошо делает то, где нужна чистота конструкции: науку, теорию, право, анализ, проектирование систем.</div>"], "Ne": ["Видит в системе и в человеке запас: другой вариант построения, исключение, неожиданное применение, — и этим делает модель точнее.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, какие неочевидные ходы открывали задачу: взгляд с другой стороны, неожиданная аналогия, исключение, которое оказалось правилом.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, где обычно прячутся альтернативы: в граничных случаях, в допущениях, которые все принимают молча, в соседних областях.</span></div><div class=\"pr\"><b>Ситуация:</b><span>видит другой путь именно здесь: иное применение этой конструкции, лазейку в этом правиле, новый класс объектов, который в схеме не учтён.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — ветки «если — то» надолго не разворачивает: возможность нужна ему, чтобы модель стала точнее, а не ради самой возможности.</span></div>"], "Fi": ["Держит дистанцию и «своё» по правилам, через усилие: вежлив, лоялен, корректен — как положено, — и устаёт от этой роли.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, где сам когда-то сблизился или отдалился: с местом, делом, вещью, человеком.</span></div><div class=\"pr\"><b>Нормы:</b><span>держит «как принято» как свод правил: вежливость, лояльность, граница допустимого, что можно говорить и чего нельзя. Ссылается на принцип: «так поступать нельзя».</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не чувствует, что здесь своё, а что чужое: что это место для него уже не своё, что эта вещь здесь лишняя, что этот человек отдалился.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не видит, как притяжение меняется со временем: узнаёт о перемене по факту, когда она уже произошла.</span></div><div class=\"it\">Своё и чужое определяет по принципу, а не по чутью. Держать это через правило утомляет, как роль, которую нельзя снять.</div>"], "Se": ["Вес, напор и форма — самое уязвимое: занять место среди людей, собраться для рывка, придать вещи и доводу выразительность.", "<div class=\"pr\"><b>Опыт:</b><span>только своё: когда приходилось собираться, отстаивать позицию, держать вес — и как тяжело это давалось. Помнит, где «надавили», и обходит такие места.</span></div><div class=\"pr no\"><b>Нормы:</b><span><i>нет</i> — не знает изнутри, как принято отстаивать место в очереди, споре, пространстве, на рынке и как придают вещам весомость.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не чувствует, сколько весит этот довод, эта вещь, это решение, когда собрать тело для рывка, где здесь центр силы.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не держит вес на дистанции: начатое напором бросает, как только нужно давить дальше.</span></div><div class=\"it\">Верное, по его ощущению, должно подействовать само. Напор, грубая форма, «будь твёрже», приказ мобилизоваться прямо сейчас попадают в самое уязвимое.</div>"], "Fe": ["Не хватает накала: построения верны, но холодны. Когда рядом загорается — дело, текст, событие, музыка, — система вдруг оживает.", "<div class=\"pr\"><b>Опыт:</b><span>только «это меня зажигает или нет», и узнаёт сразу: чужой подъём мгновенно чувствует как свой или чужой.</span></div><div class=\"pr no\"><b>Нормы:</b><span><i>нет</i> — не знает, как принято поднимать подъём: в тексте, на событии, в деле.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — сам не чувствует, где здесь горит, а где гаснет: в разговоре, в проекте, в комнате.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не выстраивает подъём и спад: заряд от него не зависит.</span></div><div class=\"it\">Заряд от другого принимает почти без проверки. Поэтому рядом с тем, кто зажигает, его точность наконец становится живой.</div>"], "Si": ["Бодрит, когда кто-то настраивает тело, обстановку и ритм: в хорошо собранном месте легче думать.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, где ему было хорошо: тихая комната, удобный стол, правильный свет.</span></div><div class=\"pr\"><b>Нормы:</b><span>охотно перенимает, как устроить свет, режим, вещи, чтобы всё сочеталось, — по совету и образцу.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — сам не собирает сочетание здесь: работает в неудобной позе, пока не заболит спина.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не предвидит, каково будет телу через час или после бессонной ночи.</span></div><div class=\"it\">Внимание к самочувствию — своему и обстановки — выводит его из головы в тело и подталкивает к делу.</div>"], "Te": ["Видит, как сделать с толком, но не делает это мерилом: «работает» не значит «правильно».", "<div class=\"pr\"><b>Опыт:</b><span>помнит, какие способы работали, а какие только создавали видимость результата.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает технологии, порядок шагов, стандарты: как принято делать дельно.</span></div><div class=\"pr\"><b>Ситуация:</b><span>видит, где здесь лишние траты сил, материала, времени, и может предложить способ проще — если тот не противоречит принципу.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — КПД надолго не просчитывает: эффективность для него ниже верности, и выгодное, но неточное решение он отвергает.</span></div><div class=\"it\">Умеет, но сдерживает. В споре может точно указать, что чужой способ работает плохо, — и этим задеть.</div>"], "Ni": ["На автомате видит, на какой стадии процесс и к чему он ведёт, — и почти не придаёт этому значения.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, как разворачивались похожие истории: теории, проекты, институты, споры.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает типовые стадии процессов: становление, расцвет, застой, распад.</span></div><div class=\"pr\"><b>Ситуация:</b><span>видит, созрело ли сейчас дело, идея, вещь, и выбирает момент, сам того не замечая.</span></div><div class=\"pr\"><b>Время:</b><span>видит, к чему всё идёт, иногда очень далеко, — но говорит об этом между делом.</span></div><div class=\"it\">Всё это фоном. Свой взгляд на линию событий не ценит, поэтому спокойно отдаёт прогноз другому.</div>"]}, "raw": {"Ti": {"Опыт": "помнит, какие построения выдерживали проверку, а какие разваливались: доказательство, где одна посылка тянула за собой всё остальное, договор с дырой в формулировке, схема, которая противоречила сама себе.", "Нормы": "знает правила построения: определение, классификация, доказательство, иерархия понятий. Видит, где нарушен порядок рассуждения, ещё до того, как может это объяснить.", "Ситуация": "соизмеряет именно этот предмет: в этой таблице одна колонка лишняя, в этом тексте термин меняет смысл на третьей странице, в этом механизме деталь выпадает из ряда остальных.", "Время": "видит, к чему правило приведёт через годы: где закон начнёт противоречить сам себе, где классификация треснет, когда появятся новые случаи, где система обречена разрастись в хаос.", "итог": "Через эту оптику он смотрит на мир: верно то, что непротиворечиво. Поэтому хорошо делает то, где нужна чистота конструкции: науку, теорию, право, анализ, проектирование систем."}, "Ne": {"Опыт": "помнит, какие неочевидные ходы открывали задачу: взгляд с другой стороны, неожиданная аналогия, исключение, которое оказалось правилом.", "Нормы": "знает, где обычно прячутся альтернативы: в граничных случаях, в допущениях, которые все принимают молча, в соседних областях.", "Ситуация": "видит другой путь именно здесь: иное применение этой конструкции, лазейку в этом правиле, новый класс объектов, который в схеме не учтён.", "Время-": "ветки «если — то» надолго не разворачивает: возможность нужна ему, чтобы модель стала точнее, а не ради самой возможности."}, "Fi": {"Опыт": "помнит, где сам когда-то сблизился или отдалился: с местом, делом, вещью, человеком.", "Нормы": "держит «как принято» как свод правил: вежливость, лояльность, граница допустимого, что можно говорить и чего нельзя. Ссылается на принцип: «так поступать нельзя».", "Ситуация-": "не чувствует, что здесь своё, а что чужое: что это место для него уже не своё, что эта вещь здесь лишняя, что этот человек отдалился.", "Время-": "не видит, как притяжение меняется со временем: узнаёт о перемене по факту, когда она уже произошла.", "итог": "Своё и чужое определяет по принципу, а не по чутью. Держать это через правило утомляет, как роль, которую нельзя снять."}, "Se": {"Опыт": "только своё: когда приходилось собираться, отстаивать позицию, держать вес — и как тяжело это давалось. Помнит, где «надавили», и обходит такие места.", "Нормы-": "не знает изнутри, как принято отстаивать место в очереди, споре, пространстве, на рынке и как придают вещам весомость.", "Ситуация-": "не чувствует, сколько весит этот довод, эта вещь, это решение, когда собрать тело для рывка, где здесь центр силы.", "Время-": "не держит вес на дистанции: начатое напором бросает, как только нужно давить дальше.", "итог": "Верное, по его ощущению, должно подействовать само. Напор, грубая форма, «будь твёрже», приказ мобилизоваться прямо сейчас попадают в самое уязвимое."}, "Fe": {"Опыт": "только «это меня зажигает или нет», и узнаёт сразу: чужой подъём мгновенно чувствует как свой или чужой.", "Нормы-": "не знает, как принято поднимать подъём: в тексте, на событии, в деле.", "Ситуация-": "сам не чувствует, где здесь горит, а где гаснет: в разговоре, в проекте, в комнате.", "Время-": "не выстраивает подъём и спад: заряд от него не зависит.", "итог": "Заряд от другого принимает почти без проверки. Поэтому рядом с тем, кто зажигает, его точность наконец становится живой."}, "Si": {"Опыт": "помнит, где ему было хорошо: тихая комната, удобный стол, правильный свет.", "Нормы": "охотно перенимает, как устроить свет, режим, вещи, чтобы всё сочеталось, — по совету и образцу.", "Ситуация-": "сам не собирает сочетание здесь: работает в неудобной позе, пока не заболит спина.", "Время-": "не предвидит, каково будет телу через час или после бессонной ночи.", "итог": "Внимание к самочувствию — своему и обстановки — выводит его из головы в тело и подталкивает к делу."}, "Te": {"Опыт": "помнит, какие способы работали, а какие только создавали видимость результата.", "Нормы": "знает технологии, порядок шагов, стандарты: как принято делать дельно.", "Ситуация": "видит, где здесь лишние траты сил, материала, времени, и может предложить способ проще — если тот не противоречит принципу.", "Время-": "КПД надолго не просчитывает: эффективность для него ниже верности, и выгодное, но неточное решение он отвергает.", "итог": "Умеет, но сдерживает. В споре может точно указать, что чужой способ работает плохо, — и этим задеть."}, "Ni": {"Опыт": "помнит, как разворачивались похожие истории: теории, проекты, институты, споры.", "Нормы": "знает типовые стадии процессов: становление, расцвет, застой, распад.", "Ситуация": "видит, созрело ли сейчас дело, идея, вещь, и выбирает момент, сам того не замечая.", "Время": "видит, к чему всё идёт, иногда очень далеко, — но говорит об этом между делом.", "итог": "Всё это фоном. Свой взгляд на линию событий не ценит, поэтому спокойно отдаёт прогноз другому."}}, "port": ["Как математик над доказательством — в теории, законе или споре людей: видит, где лишнее звено и что противоречит остальному, и находит более чистый путь.", ["Видит в любом предмете конструкцию: что чему соответствует, что к какому классу относится, где противоречие — в теории, механизме, законе, тексте, в рассуждениях людей.", "Находит в системе и в человеке запас: другой вариант построения, исключение, неожиданное применение, нераскрытую способность.", "Накала. Его построения верны, но холодны. Когда рядом загорается — дело, событие, текст, — система вдруг оживает.", "Напор, грубая форма, требование «будь твёрже» и мобилизоваться прямо сейчас. Сколько весит довод, вещь или решение, он чувствует плохо."], "там, где нужны точность и ясность: наука, теория, право, анализ, проектирование систем."], "polr": {"how": "Мера важнее массы: верное, по его ощущению, должно подействовать само. Не чувствует, сколько весит его довод, вещь, решение; когда нужно занять место, собраться для рывка, придать вещи форму — теряется.", "hurt": "напор, грубая форма, «будь твёрже», «докажи делом», приказ мобилизоваться прямо сейчас.", "defend": "уходит в теорию и иронию (ЧИ), формализует: «по правилам вы не правы».", "where": "нужно занять место в очереди, споре, пространстве, на рынке; сделать вещь выразительной; собраться на рывок без подготовки.", "why": "Робеспьер считает, что верное подействует само; Достоевский — что вес разрушит «своё». Один не видит смысла в силе, другой видит в ней угрозу.", "short": "верное должно подействовать само"}, "rel": {"ILE": "mirror", "SEI": "act", "ESE": "dual", "LII": "id", "EIE": "semi", "LSI": "quasi", "SLE": "rev_by", "IEI": "ben_by", "SEE": "conf", "ILI": "kin", "LIE": "ext", "ESI": "super", "LSE": "mirage", "EII": "business", "IEE": "rev_of", "SLI": "ben_of"}}, "EIE": {"name": "Гамлет", "ru": "ЭИЭ", "m": ["Fe", "Ni", "Te", "Si", "Ti", "Se", "Fi", "Ne"], "q": "Бета", "rat": true, "dual": "LSI", "traits": ["экстраверты", "интуиты", "этики", "рационалы", "динамики", "аристократы", "весёлые", "решительные", "беспечные", "упрямые", "квестимы", "негативисты", "стратеги", "конструктивисты", "процессоры"], "lens": {"Fi": ["Чувствует, что своё, а что чужое, но не делает из этого правил.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, что и кто стали «своими».</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, что принято беречь и к чему держать дистанцию.</span></div><div class=\"pr\"><b>Ситуация:</b><span>точно чувствует, что здесь своё, а что чужое: вещь, место, человек, идея.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — устойчивую привязанность не делает мерилом: живой накал для него важнее.</span></div><div class=\"it\">Умеет, но не превращает это в свод правил.</div>"], "Te": ["Деловитость изображает по правилам и быстро от неё устаёт.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, какие способы срабатывали.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, «как положено» делать дело: методики, порядок шагов, отчётность.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не видит, как сделать именно здесь, чтобы заработало.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не просчитывает, во что выльется усилие.</span></div><div class=\"it\">Поэтому деловитость изображает по правилам, и это быстро утомляет.</div>"], "Ni": ["Видит, на какой стадии процесс — в деле, отношениях, судьбе человека — и к чему ведёт то, что сейчас горит.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, как разворачивались похожие истории.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает типовые сюжеты и стадии: как зреет кризис, как стареет идея, как строится дуга.</span></div><div class=\"pr\"><b>Ситуация:</b><span>видит, на какой стадии именно этот процесс и что из чего вытекает, — и выбирает момент для слова или шага.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — линию не держит как самоцель: использует её как инструмент для накала.</span></div><div class=\"it\">Связывает накал с сюжетом: понимает, к чему ведёт то, что сейчас горит.</div>"], "Se": ["Чужая весомость — уверенный человек, прочное решение, основательная вещь — его мобилизует.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, когда пришлось собраться и сделать что-то весомым.</span></div><div class=\"pr\"><b>Нормы:</b><span>охотно опирается на чужой вес: на прочное решение, основательную вещь, на того, кто доведёт.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — сам не чувствует массу конкретного.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не держит вес на дистанции.</span></div><div class=\"it\">Чужая весомость его мобилизует и придаёт уверенности.</div>"], "Ti": ["Пропорции в переживаниях теряются; ясная система приносит облегчение.", "<div class=\"pr\"><b>Опыт:</b><span>только «эта логика моя или нет» — и узнаёт её сразу.</span></div><div class=\"pr no\"><b>Нормы:</b><span><i>нет</i> — сам не держит общих правил построения системы.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не раскладывает конкретное по полочкам.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не выводит следствия правила.</span></div><div class=\"it\">В буре переживаний пропорции теряются. Когда кто-то даёт ясную, непротиворечивую систему, он принимает её с облегчением.</div>"], "Fe": ["Чувствует, где горит и где гаснет, и умеет поднять или погасить накал — в человеке, разговоре, слове, сцене, деле.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, что когда-то зажигало и что гасило: сцены, слова, музыка, события.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, как принято выражать и вызывать чувство — в тексте, речи, ритуале, искусстве.</span></div><div class=\"pr\"><b>Ситуация:</b><span>чувствует накал конкретного момента и может поднять его или погасить: голосом, словом, паузой, драматургией.</span></div><div class=\"pr\"><b>Время:</b><span>видит, как будет нарастать и спадать заряд — в разговоре, проекте, истории, вечере.</span></div><div class=\"it\">Через эту оптику он объясняет себе мир: живо или мертво, горит или нет.</div>"], "Ne": ["Между делом видит запасной выход и другое применение вещей.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, какие неожиданные ходы срабатывали.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, где обычно прячутся варианты.</span></div><div class=\"pr\"><b>Ситуация:</b><span>видит запас конкретного: другое применение вещи, запасной выход, скрытую способность.</span></div><div class=\"pr\"><b>Время:</b><span>видит, во что это может вырасти.</span></div><div class=\"it\">Всё это — на автомате и между делом. Своё умение находить выход сам почти не замечает.</div>"], "Si": ["Психика и тело работают несинхронно; сочетание вещей и обстановки чувствует плохо.", "<div class=\"pr\"><b>Опыт:</b><span>только «мне сейчас хорошо или плохо», и тело сообщает это поздно.</span></div><div class=\"pr no\"><b>Нормы:</b><span><i>нет</i> — не держит изнутри норм телесного и бытового удобства.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не замечает, что свет, звук, одежда, поза, вещи вокруг не сочетаются.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не предвидит, каково будет в этой обстановке через час.</span></div><div class=\"it\">Психика и тело работают несинхронно. Замечания о внешности, вкусе, здоровье, быте попадают в самое уязвимое.</div>"]}, "raw": {"Fi": {"Опыт": "помнит, что и кто стали «своими».", "Нормы": "знает, что принято беречь и к чему держать дистанцию.", "Ситуация": "точно чувствует, что здесь своё, а что чужое: вещь, место, человек, идея.", "Время-": "устойчивую привязанность не делает мерилом: живой накал для него важнее.", "итог": "Умеет, но не превращает это в свод правил."}, "Te": {"Опыт": "помнит, какие способы срабатывали.", "Нормы": "знает, «как положено» делать дело: методики, порядок шагов, отчётность.", "Ситуация-": "не видит, как сделать именно здесь, чтобы заработало.", "Время-": "не просчитывает, во что выльется усилие.", "итог": "Поэтому деловитость изображает по правилам, и это быстро утомляет."}, "Ni": {"Опыт": "помнит, как разворачивались похожие истории.", "Нормы": "знает типовые сюжеты и стадии: как зреет кризис, как стареет идея, как строится дуга.", "Ситуация": "видит, на какой стадии именно этот процесс и что из чего вытекает, — и выбирает момент для слова или шага.", "Время-": "линию не держит как самоцель: использует её как инструмент для накала.", "итог": "Связывает накал с сюжетом: понимает, к чему ведёт то, что сейчас горит."}, "Se": {"Опыт": "помнит, когда пришлось собраться и сделать что-то весомым.", "Нормы": "охотно опирается на чужой вес: на прочное решение, основательную вещь, на того, кто доведёт.", "Ситуация-": "сам не чувствует массу конкретного.", "Время-": "не держит вес на дистанции.", "итог": "Чужая весомость его мобилизует и придаёт уверенности."}, "Ti": {"Опыт": "только «эта логика моя или нет» — и узнаёт её сразу.", "Нормы-": "сам не держит общих правил построения системы.", "Ситуация-": "не раскладывает конкретное по полочкам.", "Время-": "не выводит следствия правила.", "итог": "В буре переживаний пропорции теряются. Когда кто-то даёт ясную, непротиворечивую систему, он принимает её с облегчением."}, "Fe": {"Опыт": "помнит, что когда-то зажигало и что гасило: сцены, слова, музыка, события.", "Нормы": "знает, как принято выражать и вызывать чувство — в тексте, речи, ритуале, искусстве.", "Ситуация": "чувствует накал конкретного момента и может поднять его или погасить: голосом, словом, паузой, драматургией.", "Время": "видит, как будет нарастать и спадать заряд — в разговоре, проекте, истории, вечере.", "итог": "Через эту оптику он объясняет себе мир: живо или мертво, горит или нет."}, "Ne": {"Опыт": "помнит, какие неожиданные ходы срабатывали.", "Нормы": "знает, где обычно прячутся варианты.", "Ситуация": "видит запас конкретного: другое применение вещи, запасной выход, скрытую способность.", "Время": "видит, во что это может вырасти.", "итог": "Всё это — на автомате и между делом. Своё умение находить выход сам почти не замечает."}, "Si": {"Опыт": "только «мне сейчас хорошо или плохо», и тело сообщает это поздно.", "Нормы-": "не держит изнутри норм телесного и бытового удобства.", "Ситуация-": "не замечает, что свет, звук, одежда, поза, вещи вокруг не сочетаются.", "Время-": "не предвидит, каково будет в этой обстановке через час.", "итог": "Психика и тело работают несинхронно. Замечания о внешности, вкусе, здоровье, быте попадают в самое уязвимое."}}, "port": ["Как режиссёр спектак "Fi": ["Привязанность выражает «как положено», по правилам, — и это даётся с трудом.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, что и кто оказались «своими», а что — нет.</span></div><div class=\"pr\"><b>Нормы:</b><span>держит «своё» по правилам: как положено относиться к делу, месту, вещи, человеку.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не чувствует живого притяжения конкретного момента: где дистанция сократилась, а где выросла.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не чувствует, что станет своим со временем.</span></div><div class=\"it\">Поэтому привязанность выражает «правильно», по уставу, — и это утомляет, как роль.</div>"], "Te": ["Видит, как сделать выгоднее, но правильность для него важнее пользы.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, какие способы работали.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, как принято делать эффективно.</span></div><div class=\"pr\"><b>Ситуация:</b><span>видит, где здесь лишние траты и как сделать, чтобы заработало.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не просчитывает выгоду надолго: правильно для него важнее, чем выгодно.</span></div><div class=\"it\">Умеет, но сдерживает: польза без порядка его не убеждает.</div>"], "Ni": ["Бодрится, когда ему показывают сюжет: откуда всё пришло и куда ведёт.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, как развивались знакомые истории.</span></div><div class=\"pr\"><b>Нормы:</b><span>охотно перенимает готовые объяснения того, к чему всё идёт и на какой стадии процесс.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не видит сам, созрело ли именно это.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — линию изнутри не чувствует.</span></div><div class=\"it\">Когда ему показывают сюжет — откуда всё пришло и куда ведёт, — это бодрит: система получает направление.</div>"], "Se": ["Придаёт системе вес: доводит, закрепляет, держит порядок — в деле, команд з эту оптику он смотрит на мир: ценно то, что весит и держится. Поэтому хорошо делает то, где нужно занять, удержать и выстроить.</div>"], "Ti": ["Придаёт весу структуру: иерархию людей, порядок, правила, по которым всё держится.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, какие конструкции удерживали занятое, а какие рассыпались при первой нагрузке.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, как строят порядок: регламент, иерархия, распределение мест и ответственности, кто кому подчинён.</span></div><div class=\"pr\"><b>Ситуация:</b><span>выстраивает структуру под эту задачу: что главное, что подчинено, где граница, кто на каком месте — и легко меняет её, если вес сместился.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — систему надолго не продумывает: структура служит весу и делу, а не самой себе.</span></div>"], "Ne": ["«Новые идеи» выдаёт по образцу — «надо видеть перспективы», — и устаёт от этой роли.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, когда неожиданный ход сработал.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, что «нужно видеть перспективы» и «нужна идея», и выдаёт их по шаблону.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не видит запаса конкретного: другого применения вещи, обходного пути, скрытого ресурса у этой позиции.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не разворачивает ветки «если — то»: что будет, если пойти другим путём.</span></div><div class=\"it\">Неопределённые варианты раздражают, а роль «человека идей» утомляет. Идея, не подкреплённая весом, кажется пустой.</div>"], "Fi": ["Своё и чужое — самое уязвимое: где притяжение уже кончилось, что он оттолкнул своим весом.", "<div class=\"pr\"><b>Опыт:</b><span>только своё: кто и что когда-то отошло, — и это всегда было неожиданно.</span></div><div class=\"pr no\"><b>Нормы:</b><span><i>нет</i> — не знает изнутри, как принято держать близость и дистанцию с людьми, местами, делами.</span></div><div iv>"], "Si": ["Чувствует тело и обстановку, но не делает самочувствие мерилом.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, где телу было хорошо: еда, баня, отдых после нагрузки.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, как устроено удобное: еда, отдых, обстановка, восстановление.</span></div><div class=\"pr\"><b>Ситуация:</b><span>может собрать сочетание здесь: накрыть стол, обустроить место, восстановиться после рывка.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — самочувствие надолго не выстраивает: удобство подождёт, если есть цель, — и тело потом напоминает о себе.</span></div><div class=\"it\">Умеет, но сдерживает: удобство для него не цель. Чужую заботу о комфорте может счесть слабостью.</div>"], "Te": ["На автомате видит, как сделать, чтобы сработало.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, какие способы давали результат, а какие были пустой тратой сил.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает рабочие методики и порядок шагов.</span></div><div class=\"pr\"><b>Ситуация:</b><span>видит, где здесь лишние траты и как сделать быстрее.</span></div><div class=\"pr\"><b>Время:</b><span>видит, во что выльется усилие, и заранее отсекает то, что не окупится.</span></div><div class=\"it\">Всё это фоном. Свою деловитость почти не замечает и не ценит: для него это просто «как делать».</div>"]}, "raw": {"Se": {"Опыт": "помнит, что выдерживало нагрузку, а что ломалось: позиции, решения, конструкции, тела, команды. Помнит, где уступил и где удержал.", "Нормы": "знает, как выглядит основательное и выразительное и как удерживают занятое: место, рынок, высоту, решение.", "Ситуация": "чувствует вес именно здесь: где у этой позиции слабое место, куда приложить силу, сколько её нужно, как подать вещь так, чтобы она заняла пространство.", "Время": "держит вес на дистанции: доводит до конца, удерживает занятое годами, видит, как сила будет нарастать или убывать.", "итог": "Через эту оптику он смотрит на мир: ценно то, что веси я него опорой."}, "Fe": {"Опыт": "помнит, что зажигало: песня перед делом, общий праздник после победы.", "Нормы": "охотно перенимает, как поднимать подъём: тост, речь, праздник по образцу, — и рад одобрению.", "Ситуация-": "сам не чувствует, где горит, а где гаснет: в команде, на событии, в комнате.", "Время-": "не выстраивает подъём и спад: когда пора остановиться с весельем, не чувствует.", "итог": "Накал от другого включает его и делает дело живым. Тот, кто зажигает рядом, получает его благодарность и защиту."}, "Si": {"Опыт": "помнит, где телу было хорошо: еда, баня, отдых после нагрузки.", "Нормы": "знает, как устроено удобное: еда, отдых, обстановка, восстановление.", "Ситуация": "может собрать сочетание здесь: накрыть стол, обустроить место, восстановиться после рывка.", "Время-": "самочувствие надолго не выстраивает: удобство подождёт, если есть цель, — и тело потом напоминает о себе.", "итог": "Умеет, но сдерживает: удобство для него не цель. Чужую заботу о комфорте может счесть слабостью."}, "Te": {"Опыт": "помнит, какие способы давали результат, а какие были пустой тратой сил.", "Нормы": "знает рабочие методики и порядок шагов.", "Ситуация": "видит, где здесь лишние траты и как сделать быстрее.", "Время": "видит, во что выльется усилие, и заранее отсекает то, что не окупится.", "итог": "Всё это фоном. Свою деловитость почти не замечает и не ценит: для него это просто «как делать»."}}, "port": ["Как командир на местности: сразу видит, где высота, у кого сила и где слабое место — в людях, деле, пространстве, — и выстраивает порядок, чтобы занятое удержать.", ["Чувствует массу и форму всего — людей, позиций, вещей: кто и что весит, где центр силы, сколько места занять, когда собраться для рывка.", "Придаёт весу структуру: иерархию людей, порядок, правила, по которым всё держится.", "Сюжета. Сила момента не знает, к чему ведёт. Когда кто-то показывает линию, вес получает направление.", "Обвинение в чёрствости и внезапная обида «своих». Где его масса уже отталкивает — человека, место, дело, — он не чувствует."], "там, где нужно занять, удержать и выстроить: руководство, спорт, стройка, кризисы, запуск больших дел."], "polr": {"how": "«Своё» — то, что удержано весом: позиция, дело, место, люди рядом. Не чувствует, где его масса уже отталкивает и где притяжение кончилось; граница для него — то, что можно занять.", "hurt": "«ты всех подминаешь», «в тебе нет души», обвинение в чёрствости, внезапная обида того, кого считал своим.", "defend": "опирается на правило и структуру (БЛ): «договор есть договор»; добавляет веса.", "where": "занял место, ресурс, решение и не почувствовал, что за этим кто-то стоял; удивлён, когда «свои» вдруг отдалились.", "why": "У Дон Кихота «своё» — то, в чём есть запас; у Жукова — то, что удержано весом. Одна дыра, но смотрят на неё из разных мест.", "short": "граница = то, что можно занять"}, "rel": {"ILE": "business", "SEI": "mirage", "ESE": "ben_of", "LII": "rev_of", "EIE": "act", "LSI": "mirror", "SLE": "id", "IEI": "dual", "SEE": "quasi", "ILI": "semi", "LIE": "ben_by", "ESI": "rev_by", "LSE": "kin", "EII": "conf", "IEE": "super", "SLI": "ext"}}, "IEI": {"name": "Есенин", "ru": "ИЭИ", "m": ["Ni", "Fe", "Si", "Te", "Se", "Ti", "Ne", "Fi"], "q": "Бета", "rat": false, "dual": "SLE", "traits": ["интроверты", "интуиты", "этики", "иррационалы", "динамики", "аристократы", "весёлые", "решительные", "предусмотрительные", "уступчивые", "квестимы", "позитивисты", "тактики", "эмотивисты", "результаторы"], "lens": {"Ni": ["Видит сюжет: что из чего вытекает, на какой стадии процесс, к чему всё ведёт, — в человеке, отношениях, деле, судьбе, эпохе.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, как разворачивались похожие истории: увлечения, которые гасли, вещи, которые старели, места, которые менялись, люди, чьи судьбы шли по знакомой линии.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает типовые сюжеты: как зреет перемена, как увядает идея, как приходит конец, как после спада начинается новое.</span></div><div class=\"pr\"><b>Ситуация:</b><span>видит, на какой стадии именно этот процесс: дело ещё растёт или уже выдыхается, вещь в расцвете или скоро выйдет из жизни, момент созрел или рано.</span></div><div class=\"pr\"><b>Время:</b><span>видит длинную линию, иногда на годы вперёд, — вместе с её настроением: тревогой, светом, печалью.</span></div><div class=\"it\">Через эту оптику он смотрит на мир: каждый момент — эпизод сюжета. Поэтому хорошо чувствует направление и умеет его передать — в слове, образе, совете.</div>"], "Fe": ["Окрашивает сюжет накалом: поднимает или гасит настроение — человека, компании, текста, вечера, музыки.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, что зажигало и что гасило: песню, разговор, место, время года.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, как выражают чувство: в слове, музыке, образе, жесте, оформлении.</span></div><div class=\"pr\"><b>Ситуация:</b><span>чувствует заряд этого момента и подстраивает его под линию, которую видит: добавит печали, если дело идёт к концу, или света, если впереди подъём.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — накал строит под ближайший эпизод, а не под длинную драматургию: настроение меняется вместе с эпизодом.</span></div>"], "Si": ["Соответствует нормам удобства «как положено» и устаёт от этого.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, где телу было хорошо: тёплый плед, тихое утро, правильная еда.</span></div><div class=\"pr\"><b>Нормы:</b><span>держит бытовые и телесные нормы: режим, опрятность, «как принято» дома и на людях, — по образцу.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не чувствует сочетания конкретного: что этот свет, этот звук и эта поза вместе выматывают.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не предвидит самочувствие: каково будет завтра после этой ночи.</span></div><div class=\"it\">Заботу о теле и обстановке держит как роль, через усилие. Когда силы кончаются, первым бросает именно это.</div>"], "Te": ["Перевести линию в шаги — самое уязвимое: что сделать, чтобы сработало, и стоит ли оно усилий.", "<div class=\"pr\"><b>Опыт:</b><span>только своё: что когда-то сработало. Повторяет то, что однажды получилось, не понимая, почему.</span></div><div class=\"pr no\"><b>Нормы:</b><span><i>нет</i> — не знает изнутри, как принято делать с толком: порядок шагов, технология, расчёт.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не видит, где здесь лишние траты сил и времени и какой способ даст результат.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не просчитывает, во что выльется усилие: ждёт, пока «само созреет», и пропускает момент, когда шаг дал бы больше всего.</span></div><div class=\"it\">Видит, к чему всё идёт, но шагов нет. Упрёк в бесполезности, «где результат?» и работа по жёсткой методике попадают в самое уязвимое.</div>"], "Se": ["Не хватает веса: решимость и основательность от другого — опора, которая сдвигает линию с места.", "<div class=\"pr\"><b>Опыт:</b><span>только «весомо это для меня или нет», и узнаёт сразу: рядом с основательным человеком, вещью, решением становится спокойно.</span></div><div class=\"pr no\"><b>Нормы:</b><span><i>нет</i> — не знает изнутри, как придать вещам и решениям вес.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не чувствует массу и форму конкретного: где здесь центр силы, когда собраться.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не держит вес на дистанции: начатое без внешней опоры затухает.</span></div><div class=\"it\">Чужую решимость принимает почти без проверки: линия, которую он видит, наконец сдвигается с места.</div>"], "Ti": ["Ясность бодрит: охотно перенимает готовые системы и классификации.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, какие объяснения помогли разобраться в тумане.</span></div><div class=\"pr\"><b>Нормы:</b><span>с удовольствием учится по классификациям, схемам и правилам, рад похвале за понимание.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — сам систему под задачу не строит: без готовой схемы мысли расплываются.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не выводит следствия правила.</span></div><div class=\"it\">Тот, кто разложит всё по полочкам, выводит его из тумана настроений и подталкивает к действию.</div>"], "Ne": ["Видит другие варианты, но не уходит в них.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, какие варианты были у похожих историй.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, где прячутся другие ходы.</span></div><div class=\"pr\"><b>Ситуация:</b><span>видит запас конкретного: иное применение вещи, неожиданный поворот дела, скрытую способность человека.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — ветки не разворачивает: держит одну линию, остальные варианты отсекает.</span></div><div class=\"it\">Умеет, но сдерживает. Лишние возможности кажутся ему отвлечением от главного сюжета.</div>"], "Fi": ["На автомате чувствует, что своё, а что чужое.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, кто и что стало своим: люди, места, вещи, мелодии.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, что принято беречь и где держать дистанцию.</span></div><div class=\"pr\"><b>Ситуация:</b><span>чувствует дистанцию здесь и сейчас: кому сейчас нужен, кому нет.</span></div><div class=\"pr\"><b>Время:</b><span>видит, как притяжение будет меняться, кто отдалится и кто приблизится.</span></div><div class=\"it\">Всё это фоном. Своё чутьё к близости почти не ценит и не считает умением.</div>"]}, "raw": {"Ni": {"Опыт": "помнит, как разворачивались похожие истории: увлечения, которые гасли, вещи, которые старели, места, которые менялись, люди, чьи судьбы шли по знакомой линии.", "Нормы": "знает типовые сюжеты: как зреет перемена, как увядает идея, как приходит конец, как после спада начинается новое.", "Ситуация": "видит, на какой стадии именно этот процесс: дело ещё растё ом, вещью, решением становится спокойно.", "Нормы-": "не знает изнутри, как придать вещам и решениям вес.", "Ситуация-": "не чувствует массу и форму конкретного: где здесь центр силы, когда собраться.", "Время-": "не держит вес на дистанции: начатое без внешней опоры затухает.", "итог": "Чужую решимость принимает почти без проверки: линия, которую он видит, наконец сдвигается с места."}, "Ti": {"Опыт": "помнит, какие объяснения помогли разобраться в тумане.", "Нормы": "с удовольствием учится по классификациям, схемам и правилам, рад похвале за понимание.", "Ситуация-": "сам систему под задачу не строит: без готовой схемы мысли расплываются.", "Время-": "не выводит следствия правила.", "итог": "Тот, кто разложит всё по полочкам, выводит его из тумана настроений и подталкивает к действию."}, "Ne": {"Опыт": "помнит, какие варианты были у похожих историй.", "Нормы": "знает, где прячутся другие ходы.", "Ситуация": "видит запас конкретного: иное применение вещи, неожиданный поворот дела, скрытую способность человека.", "Время-": "ветки не разворачивает: держит одну линию, остальные варианты отсекает.", "итог": "Умеет, но сдерживает. Лишние возможности кажутся ему отвлечением от главного сюжета."}, "Fi": {"Опыт": "помнит, кто и что стало своим: люди, места, вещи, мелодии.", "Нормы": "знает, что принято беречь и где держать дистанцию.", "Ситуация": "чувствует дистанцию здесь и сейчас: кому сейчас нужен, кому нет.", "Время": "видит, как притяжение будет меняться, кто отдалится и кто приблизится.", "итог": "Всё это фоном. Своё чутьё к близости почти не ценит и не считает умением."}}, "port": ["Как поэт, читающий и эпоху, и отдельного человека: раньше других видит, к чему всё идёт — в судьбе, отношениях, событиях, — и передаёт это настроением, образом, словом.", ["Видит сюжет: что из чего вытекает, на какой стадии процесс, к чему всё ведёт — в человеке, отношениях, деле, вещи, судьбе, эпохе.", "Окрашивает линию накалом: поднимает или гасит настроение человека, компании, текста \"pr\"><b>Ситуация:</b><span>гибко выстраивает притяжения: сближает нужное, отдаляет лишнее — в команде, окружении, деле, среди вещей.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — долгую линию привязанности не делает целью: притяжение служит весу и делу.</span></div>"], "Te": ["Бодрится, когда ему показывают, как превратить вес и рывок в результат.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, какие способы давали результат.</span></div><div class=\"pr\"><b>Нормы:</b><span>охотно перенимает рабочие способы и методики.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — сам не видит, где здесь лишние траты.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не просчитывает, во что выльется усилие.</span></div><div class=\"it\">Разговор о том, как превратить вес и рывок в результат, его бодрит.</div>"], "Ni": ["Живя массой момента, не видит, куда всё идёт; показанный сюжет принимает почти без проверки.", "<div class=\"pr\"><b>Опыт:</b><span>только «эта линия моя или нет», и узнаёт сразу.</span></div><div class=\"pr no\"><b>Нормы:</b><span><i>нет</i> — не знает изнутри типовых стадий процессов.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не видит, на какой стадии именно этот процесс.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не видит, к чему всё ведёт.</span></div><div class=\"it\">Живя массой момента, нуждается в понимании, куда всё идёт; показанный сюжет принимает почти без проверки.</div>"], "Se": ["Чувствует массу и форму всего — людей, вещей, позиций: где центр силы, что весит, а что пусто, сколько места занять.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, что выдерживало нагрузку и что выглядело весомо: вещи, решения, позиции, места.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, как выглядит основательное, сильное, выразительное — в вещах, облике, пространстве.</span></div><div class=\"pr\"><b>Ситуация:</b><span>чувствует массу и форму конкретного: где здесь центр силы, сколько места занять, когда собраться для рывка, как подать вещь выразительно.</span></div><div class=\"pr\"><b>Время:</b><span>держит вес на дистанции: доводит до конца, удерживает занятое, видит, как сила будет нарастать или убывать.</span></div><div class=\"it\">Через эту оптику он смотрит на мир: ценно то, что весит.</div>"], "Ti": ["Объективная мера проигрывает весу и «своим людям»; критика выводов ранит.", "<div class=\"pr\"><b>Опыт:</b><span>только своя логика, проверенная на себе.</span></div><div class=\"pr no\"><b>Нормы:</b><span><i>нет</i> — не держит общих правил построения выводов.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не соизмеряет конкретное по объективной мерке: что чему равно, что чему противоречит.</span></div><div class=\"pr no\"><b>Время:</b><span><i>нет</i> — не выводит, к чему правило приведёт дальше.</span></div><div class=\"it\">Выводы бывают непоследовательны, а мера проигрывает весу и «своим». Критика умозаключений и разоблачённое незнание попадают в самое уязвимое.</div>"], "Fe": ["Между делом разжигает накал — вечера, дела, команды.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, что зажигало.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, как принято поднимать накал.</span></div><div class=\"pr\"><b>Ситуация:</b><span>чувствует заряд момента — вечера, дела, команды — и разжигает его.</span></div><div class=\"pr\"><b>Время:</b><span>видит, как будет нарастать и спадать накал.</span></div><div class=\"it\">Всё это — на автомате, между делом. Своё умение зажигать он почти не замечает.</div>"], "Ne": ["«Новые идеи» выдаёт эффектно, но непродуманно, и устаёт от этой роли.", "<div class=\"pr\"><b>Опыт:</b><span>помнит, когда «новая идея» сработала.</span></div><div class=\"pr\"><b>Нормы:</b><span>знает, что «нужно видеть перспективы» и «нужна идея», и выдаёт их по образцу.</span></div><div class=\"pr no\"><b>Ситуация:</b><span><i>нет</i> — не видит запаса конкретного: другого применения вещ  Fe:{0:'Живёт накалом: чувствует, где что разгорается и гаснет — в человеке, в зале, в деле, в споре, — и сам задаёт градус.',1:'Пользуется накалом как рычагом: поднимает или гасит состояние, чтобы сдвинуть ситуацию, и выбирает градус под задачу.',2:'Изображает нужное состояние по правилам: радуется, где принято, сочувствует, где положено, и сильно устаёт от этой работы.',3:'Строит жизнь на доказательстве, что умеет зажигать: выходит на сцену, громко выражает, болезненно ловит и «перегнул», и «холодный».',4:'Тянется туда, где кто-то разогревает: рядом с ярким человеком сам оживает, в ровной обстановке гаснет и не понимает почему.',6:'Умеет управлять накалом, но держит его в узде: остужает лишний шум и не даёт состоянию разгуляться — ни своему, ни чужому.',7:'Без усилия считывает и меняет накал, но не считает это важным: может разогреть зал «просто так» и уйти.'},

 Te:{0:'Живёт процессом: видит, как работают вещи, механизмы, дела, что выйдет из усилия, и всё время улучшает то, как что делается.',1:'Пользуется деловым процессом как инструментом: быстро налаживает, как сделать, когда этого требует цель, а потом возвращается к главному.',2:'Делает «как положено»: инструкции, чек-листы, правильные методы — без чутья, что из этого на самом деле работает.',3:'Строит жизнь на доказательстве полезности: перерабатывает, считает каждый результат, мучительно реагирует на «бесполезно» и «неэффективно».',4:'Ищет тех, кто наладит процесс: рядом с умелым человеком всё начинает получаться, в одиночку дела буксуют.',6:'Видит, как сделать эффективно, но в основном отсекает лишнее: «не трать на это силы» — и сам делает минимум.',7:'Делает руками и умеет быстро, но не считает это заслугой: чинит и налаживает между делом и скучает от разговоров о результате.'},
 Si:{0:'Живёт ощущениями: чувствует, как всё сочетается — свет, звук, тело, вещи, ритм дня, — и строит вокруг состояние, в котором хорошо.',1:'Использует сочетание ощущений как инструмент: подбирает обстановку, вещи, режим тела под задачу, чтобы дело шло, а не просто было приятно.',2:'Следит за собой по правилам: режим, питание, «как принято» одеваться и обставлять, — но не слышит, что телу нужно прямо сейчас.',3:'Строит жизнь на доказательстве, что умеет жить «правильно для тела»: эстетика, здоровый образ жизни, гурманство — и болезненно ловит «некрасиво» и «вредно».',4:'Ищет того, кто позаботится о телесном: рядом с таким человеком отходит, один забывает поесть и не замечает, что замёрз.',6:'Тонко чувствует тело и среду, но держит это в узде: не даёт себе расслабиться, «отдохну потом».',7:'Без усилия делает так, чтобы вещи и тело были в ладу, но не придаёт этому значения: сделал красиво и забыл.'},
 Ni:{0:'Живёт сюжетом: видит, откуда что пришло и к чему идёт — у человека, у дела, у вещи, у идеи, — и выбирает момент, когда войти и когда выйти.',1:'Использует чувство сюжета как инструмент: просчитывает, когда что сделать, чтобы история повернула туда, куда нужно.',2:'Планирует по правилам: календарь, «надо думать о будущем», прогнозы по шаблону — без настоящего чутья, к чему всё идёт.',3:'Строит жизнь на доказательстве, что видит будущее: стратегии, предсказания, «я так и знал» — и тяжело переносит, когда события пошли иначе.',4:'Ищет того, кто видит линию: рядом с ним спокойно, без него живёт сегодняшним днём и тревожится о завтрашнем.',6:'Видит, к чему всё идёт, но держит при себе: сдерживает поспешные шаги — свои и чужие — словами «не время».',7:'Чувствует сюжет и момент без усилия, но не придаёт этому веса: просто оказывается в нужное время в нужном месте.'},
 Ti:{0:'Живёт системой: держит мир в соотношениях — что больше, что важнее, что из чего следует, — и сам строит порядок.',1:'Использует системы как инструмент: быстро раскладывает задачу, находит правило, применяет и идёт дальше.',2:'Рассуждает «логично» по правилам: опирается на чужие схемы, классификации, «так написано» — без собственного чувства, что сходится.',3:'Строит жизнь на доказательстве, что мыслит строго: споры, теории, правота — и болезненно ловит «нелогично» и «ты путаешься».',4:'Ищет того, кто разложит всё по полочкам: рядом с ясным человеком голова проясняется, без него мысли путаются.',6:'Видит порядок, но использует его как фильтр: указывает на противоречия, отсекает непроверенное, критикует.',7:'Раскладывает по полочкам без усилия, но не придаёт этому значения: найдёт ошибку в схеме между делом и не станет спорить.'},
 Fi:{0:'Живёт притяжением: чувствует, что и кто кому свой или чужой — люди, вещи, места, идеи, — и выстраивает вокруг правильные дистанции.',1:'Использует чувство дистанции как инструмент: сближается и отдаляется под задачу, точно выбирает, кому что сказать.',2:'Держится этикета: «так поступают хорошие люди», правила вежливости, чужие моральные нормы — без собственного чутья, кто тут свой.',3:'Строит жизнь на доказательстве своей верности и хорошести: заботится напоказ, мучительно ловит «ты плохо поступил» и «ты чужой».',4:'Ищет того, кто покажет, где свои: рядом с тёплым и надёжным человеком спокоен, без него не понимает, кому доверять.',6:'Чувствует притяжение, но держит дистанцию: долго проверяет, кто свой, не подпускает быстро, отсекает чужих.',7:'Без усилия чувствует, кто свой, но не придаёт этому значения: ровен со всеми и сближения не ищет.'}};

      </div>
      <div class="vmatch">
        <div class="kicker">Какой ${o.name} подходит лучше всего ${lay(3)}</div>
        <a class="mbest" href="#type-${ok.toLowerCase()}-v${best}" style="--c:var(--${other[best].ka})">${D.bigs[other[best].ka]}<div><b>${other[best].n}</b> · ${rank[0][1][0]} из 5<div class="sm">${bn ? bn[0] : autoNote(n, best)}</div><div class="sm mut">Близость ценностей ${Math.round(rank[0][1][1]*100)}% · помощь по ключевой функции ${Math.round(rank[0][1][2]*100)}%</div></div><span class="go">открыть →</span></a>
        <p class="sm mut" style="margin:8px 0 4px"><b>Дуал и ключевая функция:</b> ${v.dual}</p>

      </div></div>`;
  }).join('');
  return `<div class="sheet" data-layer="2" id="vals"><div class="kicker">Разновидности · по ценностям</div><h2>Восемь разновидностей ${G(t)}</h2>

  <div class="vtabs" role="tablist">${tabs}</div>${panels}</div>`;
